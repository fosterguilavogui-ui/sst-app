<style>

</style></head><body>
<header><h1>Laguipres Sécurité – Incidents SST</h1><span class="m" id="st"></span>
<button class="g s" onclick="connect()">Dossier partagé…</button><button class="g s" onclick="load(true);pull(true)">Actualiser</button><button class="g s" onclick="cfgSync()">Synchronisation…</button><button class="g s" onclick="gotoTab('profil')">Profil</button></header>
<main id="app"></main><div id="toast"></div>
<script>
var STATES=["Déclaré","Qualifié","En investigation","Actions en cours","Vérification d'efficacité","Clôturé"];
var TYPES=["Situation dangereuse","Presqu'accident","FAC – Premiers secours","MTO – Traitement médical","RWC – Poste aménagé","LTI – Accident avec arrêt","Fatalité","Incident environnemental"];
var LEVEL={"Situation dangereuse":0,"Presqu'accident":1,"FAC – Premiers secours":2,"MTO – Traitement médical":3,"RWC – Poste aménagé":3,"LTI – Accident avec arrêt":4,"Fatalité":5};
var LEGACY={"Accident sans arrêt":"MTO – Traitement médical","Accident avec arrêt":"LTI – Accident avec arrêt"};
var NOTIF={"Fatalité":"immédiat : DG Laguipres Simandou + CTG + autorités guinéennes","LTI – Accident avec arrêt":"< 1 heure : Dir. HSE + DG + CTG HSE","MTO – Traitement médical":"< 4 heures : Dir. HSE + chef de projet","FAC – Premiers secours":"< 24 heures : Resp. HSE site + chef d'équipe","Presqu'accident":"< 48 heures : Resp. HSE site","Situation dangereuse":"< 72 heures : technicien HSE","Incident environnemental":"déversement de produits dangereux : notification immédiate (PROC-006)"};
var MISSIONS=["CTG – Maintenance des wagons","CTG – Sécurité du corridor Nialinko-Kérouané","Audit opérationnel – Conakry"],MCODE=["WAG","COR","AUD"],dashMission=0;
function setMission(x){dashMission=x===""?"":+x;render()}
var MONTHS=["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
var SITES=["Conakry","Sangaredi","Kamsar","Belair","Fria","Kouroussa","Beyla","CTG – Maintenance wagons","CTG – Corridor Nialinko-Kérouané"];
var CODE=["BOK","FRI","CKY","RES","SMD","SMW","KAM","SAN","BEL","KOU","BEY"];
var LOCAL=!window.showDirectoryPicker,dir=null,pendingHandle=null,cases={},sel=null,tab="list",me=localStorage.getItem("lag-me")||"";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function lvl(g,p){var s=g*p;return s<=4?"Faible":s<=8?"Modérée":s<=12?"Élevée":"Critique"}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function rnd(){return Math.random().toString(36).slice(2,6).toUpperCase()}
function slug(s){return(s||"anon").normalize("NFD").replace(/[^\w]+/g,"-").replace(/^-|-$/g,"").toLowerCase()||"anon"}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display="none"},3500)}
function v(i){return document.getElementById(i).value}
/* ---- stockage du dossier (poignée mémorisée) ---- */
function idb(){return new Promise(function(r,j){var q=indexedDB.open("lag-sst",1);q.onupgradeneeded=function(){q.result.createObjectStore("k")};q.onsuccess=function(){r(q.result)};q.onerror=j})}
function kget(k){return idb().then(function(d){return new Promise(function(r){var t=d.transaction("k").objectStore("k").get(k);t.onsuccess=function(){r(t.result)};t.onerror=function(){r(null)}})})}
function kset(k,x){return idb().then(function(d){return new Promise(function(r){var t=d.transaction("k","readwrite");t.objectStore("k").put(x,k);t.oncomplete=r})})}
function useLS(){return LOCAL||(!dir&&!!GH.repo)}
function status(){document.getElementById("st").textContent=(me?me+" · ":"")+(LOCAL?"Mode téléphone : enregistré sur l'appareil":dir?"Dossier connecté : "+dir.name:"Dossier non connecté")+" · "+ghStatus();var e0=document.getElementById("st");e0.style.cursor="pointer";e0.title="Toucher pour ouvrir la page Synchronisation";e0.onclick=function(){gotoTab("sync")}}
async function connect(){if(LOCAL){toast("Sur téléphone, utilisez « Envoyer au bureau ».");return}
try{dir=await showDirectoryPicker({mode:"readwrite"});pendingHandle=null;await kset("dir",dir);await load(true)}catch(e){}status();render()}
async function restore(){if(LOCAL){await load();status();return}try{var h=await kget("dir");if(h){if(await h.queryPermission({mode:"readwrite"})==="granted"){dir=h;await load()}else pendingHandle=h}}catch(e){}status();render()}
async function regrant(){try{if(await pendingHandle.requestPermission({mode:"readwrite"})==="granted"){dir=pendingHandle;pendingHandle=null;await load(true)}}catch(e){}status();render()}
/* ---- lecture / écriture : un fichier par version, nom unique par auteur ---- */
async function load(manual){if(useLS()){try{cases=JSON.parse(localStorage.getItem("lag-local")||"{}")}catch(e){cases={}}applyRemote();var b=document.activeElement;if(manual||!(b&&/INPUT|TEXTAREA|SELECT/.test(b.tagName)))render();return}if(!dir)return;var out={};
try{var cd=await dir.getDirectoryHandle("cases");
for await(var e of cd.entries()){if(e[1].kind==="file"){if(/\.json$/.test(e[0])){try{var c0=JSON.parse(await(await e[1].getFile()).text());if(c0&&c0.key&&(!out[c0.key]||c0.t>out[c0.key].t))out[c0.key]=c0}catch(x){}}continue}if(e[1].kind!=="directory")continue;
for await(var f of e[1].entries()){if(!/\.json$/.test(f[0]))continue;
try{var c=JSON.parse(await(await f[1].getFile()).text());if(c&&c.key&&(!out[c.key]||c.t>out[c.key].t))out[c.key]=c}catch(x){}}}}catch(x){}
cases=out;applyRemote();var a=document.activeElement;if(manual||!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();if(manual)toast("Données actualisées.")}
async function save(c){if(useLS()){if(!me){toast("Indiquez votre nom.");return false}c.t=new Date().toISOString();c.by=me;cases[c.key]=c;try{localStorage.setItem("lag-local",JSON.stringify(cases))}catch(e){toast("Stockage plein : envoyez vos dossiers.");return false}enqueue(c);return true}if(!dir){toast("Connectez d'abord le dossier partagé.");return false}
if(!me){toast("Indiquez votre nom.");return false}
try{c.t=new Date().toISOString();c.by=me;
var d1=await dir.getDirectoryHandle("cases",{create:true}),d2=await d1.getDirectoryHandle(c.key,{create:true});
var fh=await d2.getFileHandle(c.t.replace(/[:.]/g,"-")+"_"+slug(me)+".json",{create:true});
var w=await fh.createWritable();await w.write(JSON.stringify(c));await w.close();cases[c.key]=c;enqueue(c);return true}
catch(e){toast("Écriture impossible : "+e.message);return false}}
function edit(key,fn){var c=JSON.parse(JSON.stringify(cases[key]));fn(c);return save(c).then(function(ok){if(ok)render();return ok})}
/* ---- vues ---- */
function render(){syncSites();var m=document.getElementById("app"),h="";
if(LOCAL)h+='<div class="card">Mode téléphone : vos dossiers sont enregistrés sur cet appareil. Utilisez <b>Envoyer au bureau</b> après chaque saisie (WhatsApp, e-mail ou Drive).</div>';
if(!me)h+='<div class="card warn"><b>Première utilisation</b><label>Votre nom et fonction</label><input id="me" placeholder="ex. Mamadou Diallo, superviseur Boké"><p><button onclick="setMe()">Valider</button></p></div>';
if(pendingHandle&&!dir)h+='<div class="card warn">Le dossier partagé doit être reconnecté. <button class="s" onclick="regrant()">Reconnecter</button></div>';
if(!GH.repo)h+='<div class="card warn"><b>Activation de la synchronisation</b><label>Code d\'activation fourni par le service HSE</label><input id="act" placeholder="LAG1.…"><p><button onclick="activate()">Activer</button></p></div>';
h+=(ghErr&&tab!=="sync"?'<div class="card warn" style="cursor:pointer" onclick="gotoTab(\'sync\')">⚠ La synchronisation a un problème (erreur '+ghErr+'). <b>Touchez ici</b> pour lancer le diagnostic.</div>':"")+tabsHtml();
h+=tab==="new"?vNew():tab==="dash"?vDash():tab==="act"?vMod():tab==="audit"?vAudit():tab==="hse"?vHse():tab==="sync"?vSyncPage():tab==="enr"?vEnr():tab==="reu"?vReu():tab==="dir"?vDirTab():tab==="profil"?vProfil():(sel&&cases[sel]?vDetail():vList());m.innerHTML=h;if(tab==="new")crit();afterRender()}
function setMe(){var n=v("me").trim();if(!n)return;me=n;localStorage.setItem("lag-me",n);status();render()}
var dashYear=(new Date()).getFullYear(),showArch=false;
function all(){return Object.keys(cases).map(function(k){return cases[k]})}
function ctype(c){return LEGACY[c.type]||c.type}
function list(){return all().filter(function(c){return !c.kind&&(showArch||!c.archived)&&(!PROF.site||c.site===PROF.site)}).sort(function(a,b){return b.date.localeCompare(a.date)})}
function late(c){return(c.acts||[]).filter(function(a){return!a.done&&a.due&&a.due<today()}).length}
function vList(){var L=list(),ouv=L.filter(function(c){return c.state<5}).length,ret=L.reduce(function(n,c){return n+late(c)},0);
var h='<div class="card"><b>'+L.length+'</b> dossier(s) · <b>'+ouv+'</b> ouvert(s) · <b>'+ret+'</b> action(s) en retard · <button class="g s" onclick="showArch=!showArch;render()">'+(showArch?"Masquer":"Afficher")+' les archivés</button></div>';
if(!L.length)return h+'<div class="card m">Aucun dossier pour le moment.</div>';
return h+L.map(function(c){var l=lvl(c.g,c.p);return'<div class="card item" onclick="sel=\''+esc(c.key)+'\';render()"><b>'+esc(c.id)+'</b> <span class="b '+l+'">'+l+'</span> '+(late(c)?'<span class="b Critique">retard</span>':'')+(c.archived?' <span class="b" style="background:#7a8794">archivé</span>':'')+'<div>'+esc(ctype(c))+' · '+esc(c.site)+(c.mission?' · '+esc(c.mission):'')+'</div><div class="m">'+esc(c.date.replace("T"," "))+' · '+esc(STATES[c.state])+' · saisi par '+esc(c.by||"?")+'</div></div>'}).join("")}
function opts(a,s){return a.map(function(x,i){return'<option value="'+i+'"'+(i===s?" selected":"")+'>'+esc(x)+'</option>'}).join("")}
function vNew(){var d=new Date(),iso=today()+"T"+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
return'<div class="card"><div class="row"><div><label>Mission</label><select id="n-mis">'+opts(MISSIONS,0)+'</select></div><div><label>Type</label><select id="n-type">'+opts(TYPES,0)+'</select></div><div><label>Site</label><select id="n-site">'+opts(SITES,0)+'</select></div><div><label>Date et heure</label><input id="n-date" type="datetime-local" value="'+iso+'"></div></div>'
+'<label>Description des faits</label><textarea id="n-desc"></textarea><label>Mesures immédiates</label><textarea id="n-imm"></textarea><label>Personne concernée (fonction, sans nom)</label><input id="n-who"><div class="row"><div><label>Matricule (sans nom)</label><input id="n-mat"></div><div><label>Jours perdus (si accident avec arrêt)</label><input id="n-jp" type="number" min="0"></div></div>'
+'<div class="row"><div><label>Gravité (1-5)</label><select id="n-g" onchange="crit()">'+[1,2,3,4,5].map(function(i){return'<option>'+i+'</option>'}).join("")+'</select></div><div><label>Probabilité (1-5)</label><select id="n-p" onchange="crit()">'+[1,2,3,4,5].map(function(i){return'<option>'+i+'</option>'}).join("")+'</select></div><div><label>Criticité</label><div id="n-crit"></div></div></div>'
+'<p><button onclick="submitNew()">Enregistrer le signalement</button></p></div>'}
function crit(){var g=+v("n-g"),p=+v("n-p"),l=lvl(g,p);document.getElementById("n-crit").innerHTML='<span class="b '+l+'">'+l+'</span> <span class="m">'+g*p+'</span>'}
async function submitNew(){var d=v("n-desc").trim();if(!d){toast("Ajoutez une description des faits.");return}
var si=+v("n-site"),dt=v("n-date"),key=Date.now().toString(36)+"-"+rnd();
var c={key:key,mission:MISSIONS[+v("n-mis")],id:codeOf(SITES[si])+"-"+dt.slice(0,10).replace(/-/g,"")+"-"+rnd(),type:TYPES[+v("n-type")],site:SITES[si],date:dt,desc:d,imm:v("n-imm"),who:v("n-who"),g:+v("n-g"),p:+v("n-p"),mat:v("n-mat").trim(),jp:parseInt(v("n-jp"))||0,archived:false,state:0,faits:"",ana:"",hist:[today()+" Déclaré"],acts:[]};
if(await save(c)){toast("Signalement "+c.id+" enregistré.");sel=key;tab="list";render()}}
function vDetail(){var c=cases[sel],l=lvl(c.g,c.p);
return'<p><button class="g s" onclick="sel=null;render()">← Retour</button> '+(LOCAL?'<button class="s" onclick="sendCase(sel)">Envoyer ce dossier</button>':'')+'</p><div class="card"><b>'+esc(c.id)+'</b> <span class="b '+l+'">'+l+'</span><div>'+esc(ctype(c))+' · '+esc(c.site)+(c.mission?' · '+esc(c.mission):'')+(LEVEL[ctype(c)]!=null?' · Niveau '+LEVEL[ctype(c)]:'')+'</div><div class="m">'+esc(c.date.replace("T"," "))+' · saisi par '+esc(c.by||"?")+(c.mat?' · matricule '+esc(c.mat):'')+'</div>'+(NOTIF[ctype(c)]?'<div class="m">Notification : '+esc(NOTIF[ctype(c)])+'</div>':'')+'<p>'+esc(c.desc)+'</p><div class="m">Mesures immédiates : '+esc(c.imm||"—")+'</div></div>'
+'<div class="card"><label>État</label><select onchange="setState(+this.value)">'+opts(STATES,c.state)+'</select>'
+'<label>Faits confirmés</label><textarea id="d-faits">'+esc(c.faits)+'</textarea><label>Hypothèses de causes</label><textarea id="d-ana">'+esc(c.ana)+'</textarea><label>Jours perdus (accident avec arrêt)</label><input id="d-jp" type="number" min="0" value="'+(c.jp||0)+'"><p><button onclick="saveTxt()">Enregistrer</button> <button class="g" onclick="archiveToggle()">'+(c.archived?"Restaurer":"Archiver")+'</button></p></div>'
+'<div class="card"><b>Actions correctives</b>'+((c.acts||[]).map(function(a,i){return'<div style="margin:6px 0">'+(a.done?'✔ ':'☐ ')+esc(a.t)+' <span class="m">— '+esc(a.who||"?")+', échéance '+esc(a.due||"?")+(!a.done&&a.due&&a.due<today()?' <b style="color:#b3261e">en retard</b>':'')+'</span> '+(a.done?'':'<button class="s g" onclick="doneAct('+i+')">Fait</button>')+'</div>'}).join("")||'<div class="m">Aucune action.</div>')
+'<div class="row"><div><label>Action</label><input id="a-t"></div><div><label>Responsable</label><input id="a-who"></div><div><label>Échéance</label><input id="a-due" type="date"></div></div><p><button onclick="addAct()">Ajouter l\'action</button></p></div>'
+'<div class="card m"><b>Historique</b><br>'+(c.hist||[]).map(esc).join("<br>")+'</div>'}
function hrs(ym){var ok=function(c){return c&&c.hours!=null&&c.hours!==""&&!isNaN(+c.hours)};
if(dashMission===""){var t=null;all().forEach(function(c){if(c.kind==="heures"&&c.month===ym&&ok(c))t=(t||0)+ +c.hours});return t}
var c=cases["hrs-"+MCODE[dashMission]+"-"+ym];return ok(c)?+c.hours:null}
function agg(L,H){var n=function(t){return L.filter(function(c){return ctype(c)===t}).length};
var o={fat:n("Fatalité"),lti:n("LTI – Accident avec arrêt"),rwc:n("RWC – Poste aménagé"),mto:n("MTO – Traitement médical"),fac:n("FAC – Premiers secours"),nm:n("Presqu'accident"),sd:n("Situation dangereuse"),env:n("Incident environnemental")};
o.jp=L.reduce(function(s,c){return s+(+c.jp||0)},0);o.ltiAll=o.fat+o.lti;o.rec=o.fat+o.lti+o.rwc+o.mto;o.H=H;
o.tf=H>0?o.ltiAll*1e6/H:null;o.tg=H>0?o.jp*1000/H:null;o.trir=H>0?o.rec*200000/H:null;return o}
function f2(x){return x==null?"—":(Math.round(x*100)/100).toLocaleString("fr-FR")}
function setHours(ym,val){if(dashMission===""){toast("Choisissez une mission pour saisir les heures.");return}var n=parseFloat(String(val).replace(",","."));if(val===""||isNaN(n)||n<0){toast("Nombre d'heures invalide.");return}
var hk="hrs-"+MCODE[dashMission]+"-"+ym,c=cases[hk]?JSON.parse(JSON.stringify(cases[hk])):{key:hk,id:"HEURES-"+MCODE[dashMission]+"-"+ym,kind:"heures",mission:MISSIONS[dashMission],month:ym,type:"Heures",site:"—",date:ym+"-01T00:00",state:5,g:1,p:1,desc:"",faits:"",ana:"",acts:[],hist:[]};
c.hours=n;save(c).then(function(ok){if(ok){toast("Heures de "+ym+" enregistrées.");var e=document.getElementById("dash-ytd");if(e)e.innerHTML=ytdHtml()}})}
function archiveToggle(){edit(sel,function(c){c.archived=!c.archived;c.hist=c.hist||[];c.hist.push(today()+(c.archived?" Archivé":" Restauré"))}).then(function(ok){if(ok)toast("Dossier mis à jour.")})}
function dashData(){var y=dashYear,I=all().filter(function(c){return !c.kind&&!c.archived&&(dashMission===""||c.mission===MISSIONS[dashMission])}),cols=[],tH=0,miss=[];
for(var m=1;m<=12;m++){var ym=y+"-"+("0"+m).slice(-2),L=I.filter(function(c){return c.date.slice(0,7)===ym}),H=hrs(ym);cols.push({ym:ym,a:agg(L,H)});if(H)tH+=H;if(L.length&&H==null)miss.push(MONTHS[m-1])}
var yl=I.filter(function(c){return c.date.slice(0,4)===String(y)});return{cols:cols,tot:agg(yl,tH>0?tH:null),miss:miss,yl:yl}}
function ytdHtml(){var d=dashData(),t=d.tot;return'Cumul '+dashYear+' : <b>'+f2(t.H)+'</b> h · TF1 <b'+(t.tf>0?' class="red"':'')+'>'+f2(t.tf)+'</b> · TG <b'+(t.tg>0?' class="red"':'')+'>'+f2(t.tg)+'</b> · TRIR <b'+(t.trir>2?' class="red"':'')+'>'+f2(t.trir)+'</b>'}
function vDash(){var d=dashData(),y=dashYear,A=d.yl.reduce(function(s,c){(c.acts||[]).forEach(function(a){s.t++;if(a.done)s.d++;else if(a.due&&a.due<today())s.r++});return s},{t:0,d:0,r:0});
var yo=[y-1,y,y+1].map(function(v2){return'<option'+(v2===y?" selected":"")+'>'+v2+'</option>'}).join("");
var R=[["Heures travaillées","H","h"],["sec","SÉCURITÉ"],["Fatalités","fat"],["LTI (accidents avec arrêt)","lti"],["RWC (poste aménagé)","rwc"],["MTO (traitement médical)","mto"],["FAC (premiers secours)","fac"],["Presqu'accidents","nm"],["Situations dangereuses","sd"],["Incidents environnementaux","env"],["Jours perdus","jp"],["sec","TAUX"],["TF1 (LTI × 1 000 000 / h)","tf","r"],["TG (jours perdus × 1 000 / h)","tg","r"],["TRIR (enregistrables × 200 000 / h)","trir","r"]];
var tb=R.map(function(r){if(r[0]==="sec")return'<tr class="sec"><td colspan="14">'+r[1]+'</td></tr>';

var FIAC={"FIAC-001":{"titre":"Déplacement et couplage de wagons","risque":"RISQUE MORTEL : ÉCRASEMENT PAR WAGON – ZÉRO TOLÉRANCE POUR TOUTE DÉVIATION","sections":[{"t":"A – PRÉREQUIS AVANT DÉPLACEMENT","items":["PTW Général émis, signé et affiché sur le poste de travail","JSA spécifique au déplacement réalisée et validée par le HSE","Communication radio vérifiée avec la cabine de conduite CTG","Fenêtre de travaux accordée par CTG Operations (si voie active)","Zone de dégagement : périmètre de 5 m autour des wagons balisé","Aucun travailleur dans la zone de manœuvre (comptage d'effectif)","Signaleur désigné et positionné avec visibilité complète","Cales de déraillement en place sur wagons non concernés","Éclairage suffisant (si travaux nocturnes : éclairage artificiel > 200 lux)"]},{"t":"B – EPI OBLIGATOIRES POUR CETTE ACTIVITÉ","items":["Casque de sécurité homologué (EN 397)","Chaussures de sécurité S3 (embout acier, anti- perforation)","Vêtement haute visibilité classe 3 (EN ISO 20471)","Gants de manutention anti-coupures","Lunettes de protection (si déplacement par soufflage ou poussière)"]},{"t":"C – PROCÉDURE DE DÉPLACEMENT","items":["Annonce radio : '3 coups klaxon' avant tout déplacement de wagon","Vitesse de déplacement ≤ 5 km/h en zone atelier, ≤ 15 km/h sur voie","Signaleur en position visible du conducteur à TOUT moment","Communication continue conducteur / signaleur pendant la manœuvre","ARRÊT IMMÉDIAT si tout travailleur pénètre dans la zone de manœuvre","Vérification de l'alignement des wagons avant couplage","Couplage vérifié par le technicien de maintenance avant départ","Cales retirées uniquement après signal du conducteur"]},{"t":"D – APRÈS LE DÉPLACEMENT","items":["Wagon immobilisé : cales de déraillement remises en place","Freins à main serrés vérifiés","Zone remise en état : barrières retirées, passage dégagé","Confirmation à CTG Operations : manœuvre terminée","PTW clôturé et signé"]}]},"FIAC-002":{"titre":"Travail sous wagon – vérins et fosses","risque":"RISQUE MORTEL : EFFONDREMENT DU WAGON – CONSIGNATION ET CALES OBLIGATOIRES","sections":[{"t":"A – PRÉREQUIS","items":["PTW Général émis et signé (+ mention travail sous charge)","Wagon immobilisé : cales de déraillement + freins à main serrés","Consignation voie : fenêtre travaux accordée par CTG si zone active","Zone balisée : ruban + panneaux 'TRAVAIL SOUS WAGON – ACCÈS INTERDIT'","Aucun mouvement de wagon autorisé dans la zone pendant les travaux"]},{"t":"B – VÉRIFICATION VÉRINS ET ÉQUIPEMENTS DE CALAGE","items":["Vérins hydrauliques : certification en cours de validité (révision < 1 an)","Vérins positionnés aux points de levage indiqués sur la fiche technique wagon","Capacité des vérins vérifiée : CMU > masse essieu × 1,5 minimum","Cales mécaniques de sécurité en place AVANT toute intervention sous le wagon","Cales en bois ou métal certifiées : aucune improvisation de calage","Vérification stabilité du sol sous les vérins (pas de sol meuble)","Éclairage de la fosse : minimum 200 lux, lampe anti-choc","Ventilation de la fosse : extraction mécanique si fosse fermée"]},{"t":"C – EPI OBLIGATOIRES","items":["Casque de sécurité (protège la tête contre les chocs de structure)","Lunettes de protection (résidus, graisses, rouille)","Gants de travail adaptés à la tâche","Vêtement de travail (pas de parties flottantes)","Chaussures de sécurité S3","Genouillères si travail à genou prolongé"]},{"t":"D – PENDANT LES TRAVAUX","items":["Toujours informer le chef d'équipe avant d'entrer sous le wagon","Ne jamais rester sous une charge reposant uniquement sur les vérins (cales obligatoires)","Communication maintenue avec collègue au-dessus de la fosse","Outils posés au sol (jamais sur les essieux ou les structures fragiles)","En cas de bruit anormal ou mouvement du wagon : sortie immédiate"]},{"t":"E – APRÈS LES TRAVAUX","items":["Tous les travailleurs sortis de sous le wagon avant descente","Matériel et outillage retirés (vérification complète)","Remontée contrôlée du wagon : cales retirées en dernier","Vérification visuelle : aucune pièce détachée laissée sous le wagon","PTW clôturé et archivé"]}]},"FIAC-003":{"titre":"Soudure, oxycoupage et meulage","risque":"RISQUE INCENDIE ET BRÛLURES – PERMIS À FEU OBLIGATOIRE SANS EXCEPTION","sections":[{"t":"A – PRÉREQUIS – PERMIS À FEU","items":["PTW Travail à Chaud (rouge) émis, signé, affiché sur le poste","JSA travail à chaud réalisée","Guetteur incendie désigné, nommément, et à son poste","Zone de 10 m dégagée de tout combustible (bois, chiffons, plastiques, huiles)","Détecteur de gaz testé si atmosphère potentiellement inflammable"]},{"t":"B – EPI TRAVAIL À CHAUD","items":["Masque de soudeur auto-obscurcissant (DIN 11–13) ou lunettes oxycoupage","Tablier cuir manches longues (EN 11612)","Gants de soudeur cuir – longueur ≥ 300 mm (EN 12477 Type A)","Chaussures de sécurité S3 (embouts non exposés, lacets rentrés)","Casque de sécurité","Masque respiratoire FFP3 si espace semi-confiné ou alliages spéciaux (Zn, Pb)","Vêtement ignifugé (aucun vêtement synthétique sous les EPI à chaud)"]},{"t":"C – PROTECTION INCENDIE","items":["Extincteur poudre ABC 6 kg minimum – à moins de 3 m du point chaud","Couverture coupe-feu (1 × 1,5 m minimum) disponible sur poste","Tuyau d'eau ou seau de sable accessible","Écran / rideau de soudage en place (protection des tiers)","Surfaces adjacentes arrosées si risque de propagation chaleur","Détecteur incendie de la zone : fonctionnel ou neutralisé avec accord HSE"]},{"t":"D – GESTION DES BOUTEILLES DE GAZ (oxycoupage)","items":["Bouteilles en position debout et enchaînées au chariot","Oxygène et acétylène séparés (distance ≥ 2 m ou cloison coupe-feu)","Date de révision des bouteilles en cours de validité","Tuyaux flexibles : absence de fuite (test eau savonneuse), < 5 ans","Détendeurs adaptés à chaque gaz, manodétendeurs fonctionnels","Robinets fermés en cas d'interruption > 5 minutes"]},{"t":"E – PENDANT LES TRAVAUX","items":["Guetteur incendie présent à son poste EN PERMANENCE","Zone de 10 m maintenue dégagée en continu","Projections ne dépassant pas le périmètre sécurisé","Surveillance des surfaces chaudes adjacentes (risque feu latent)"]},{"t":"F – SURVEILLANCE POST-TRAVAUX (30 minutes minimum)","items":["Inspection complète de toute la zone après arrêt des travaux","Vérification surfaces à la main et visuellement (chaleur résiduelle)","Robinets bouteilles fermés et vérifiés","Guetteur maintenu 30 minutes après fin des travaux","PTW clôturé UNIQUEMENT après les 30 minutes de surveillance"]}]},"FIAC-004":{"titre":"Travail en hauteur – toiture wagons","risque":"RÈGLE CARDINALE : ZÉRO TRAVAIL EN HAUTEUR SANS HARNAIS CERTIFIÉ ET POINT D'ANCRAGE","sections":[{"t":"A – PRÉREQUIS","items":["PTW Travail en Hauteur (vert) émis, signé et affiché","Formation travail en hauteur à jour (recyclage < 12 mois)","Conditions météo acceptables : vent < 50 km/h, pas d'orage, pas de pluie intense","Binôme ou surveillant désigné au pied de la structure"]},{"t":"B – VÉRIFICATION HARNAIS (7 POINTS)","items":["Point 1 – Sangles dorsales/ventrales : non coupées, non effilochées","Point 2 – Boucles d'ajustement : coulissement libre, pas de corrosion","Point 3 – Anneau dorsal (D-ring) : non déformé, soudure intacte","Point 4 – Coutures (stitching) : toutes intactes, aucun fil cassé","Point 5 – Longe/absorbeur d'énergie : gaine non ouverte (sinon : REFUS)","Point 6 – Mousquetons : ouverture manuelle, verrouillage auto OK","Point 7 – Marquage/étiquette : date fab. lisible, < 10 ans, norme EN"]},{"t":"C – POINT D'ANCRAGE ET LIGNE DE VIE","items":["Point d'ancrage identifié sur plan ou matérialisé sur site","Résistance certifiée ≥ 15 kN (plaque ou marquage visible)","Ligne de vie horizontale toiture wagon : câble inox ≥ 6 mm, EN 795","Longe reliée au point d'ancrage AVANT de monter","Hauteur de chute libre calculée : masse × facteur ≤ résistance ancrage","Zone au sol balisée (périmètre de chute + 1 m) – accès interdit"]},{"t":"D – EPI HAUTEUR","items":["Harnais anti-chute complet, inspecté (fiche de vérif. complétée)","Longe à absorbeur d'énergie (< 2 m) ou enrouleur anti-chute","Casque de sécurité avec jugulaire attachée","Chaussures de sécurité S3 avec semelle anti-dérapante","Gants anti-coupures (manipulation câbles, tôles)","Vêtement haute visibilité classe 2 minimum"]},{"t":"E – PENDANT LES TRAVAUX","items":["Harnais relié au point d'ancrage / ligne de vie EN PERMANENCE","Déplacement sur toiture : progression par pas assurés, main courante si disponible","Outils attachés ou posés dans sac bandoulière (pas de chutes d'objets)","Communication maintenue avec le surveillant au sol","En cas de vent soudain > 50 km/h : descente immédiate et sécurisée"]},{"t":"F – APRÈS LES TRAVAUX","items":["Descente sécurisée : harnais relié jusqu'au niveau inférieur stable","Harnais inspecté après utilisation (si chute : mis hors service)","Zone au sol libérée et barrières retirées","PTW clôturé et signé"]}]},"FIAC-005":{"titre":"Travaux électriques HT/BT","risque":"ÉLECTROCUTION = MORT IMMÉDIATE – CONSIGNATION COMPLÈTE OBLIGATOIRE AVANT TOUTE INTERVENTION","sections":[{"t":"A – PRÉREQUIS","items":["PTW Électrique (bleu) émis, signé et approuvé par électricien habilité","Habilitation électrique de TOUS les intervenants vérifiées et en cours de validité","Schéma électrique de l'installation disponible sur le poste","Pour HT : double approbation HSE + Électricien B2T ou BR minimum"]},{"t":"B – CONSIGNATION ÉLECTRIQUE (LOTO ÉLECTRIQUE)","items":["Identification de TOUTES les sources d'alimentation électrique","Disjoncteur(s) ouvert(s) et verrouillés (cadenas + étiquette 'NE PAS MANŒUVRER')","Test de tension = 0V vérifié avec voltmètre CAT IV (avant toute intervention)","Mise à la terre et en court-circuit pour HT (décharge condensateurs)","Consignation vérifiée et validée par Technicien HSE"]},{"t":"C – EPI ÉLECTRIQUES","items":["Gants isolants classe appropriée (classe 2 pour BT jusqu'à 17 kV, classe 4 pour HT)","Gants testés et date d'épreuve en cours de validité","Tapis isolant positionné sur le poste de travail","Lunettes de protection (risque d'arc électrique)","Vêtement anti-arc (si risque d'arc calculé > 1,2 cal/cm²)","Casque de sécurité non conducteur","Chaussures isolantes ou semelles isolantes","Outil à manche isolé (classe appropriée à la tension)"]},{"t":"D – PENDANT LES TRAVAUX","items":["Travailler à UN seul câble ou conducteur à la fois","Ne jamais travailler seul sur installation électrique HT","Maintien de la distance de sécurité des parties sous tension voisines","En cas d'arc ou d'étincelle inattendue : ARRÊT IMMÉDIAT","Aucune modification non planifiée du schéma sans nouveau PTW"]},{"t":"E – DÉCONSIGNATION ET REMISE EN SERVICE","items":["Tous les outils retirés et comptés","Tous les intervenants hors de la zone","Retraits cadenas uniquement par les personnes qui les ont posés","Test de bon fonctionnement (mesures, contrôle phase/neutre)","PTW électrique clôturé et signé","Information à l'équipe de la remise en service"]}]},"FIAC-006":{"titre":"Levage et élingage","risque":"UNE CHARGE EN SUSPENSION EST UN DANGER MORTEL – JAMAIS SOUS UNE CHARGE","sections":[{"t":"A – VÉRIFICATION DE L'APPAREIL DE LEVAGE","items":["Certification appareil de levage à jour (révision annuelle organisme agréé)","CMU clairement indiquée sur l'appareil et visible","Limiteur de charge fonctionnel (test à vide avant opération)","Fin de course haut et bas vérifiés","Crochet : déformation absente, linguet de sécurité fonctionnel","Câble/chaîne : contrôle visuel (pas de fils cassés, pas de kinks, pas d'allongement)"]},{"t":"B – VÉRIFICATION DES ACCESSOIRES DE LEVAGE","items":["Élingues : étiquette CMU lisible, aucun effilochage/coupure/brûlure","Angle d'élingage vérifié : ≤ 60° par rapport à la verticale","Protège-arêtes en place sur toutes les arêtes vives","Manilles : écrou de sécurité en place, filetage non endommagé","Crochets : linguet fonctionnel, pas de déformation > 10%","Palonnier (si utilisé) : certification et CMU vérifiées"]},{"t":"C – PRÉPARATION DU LEVAGE","items":["Masse exacte de la charge identifiée (pesée ou données constructeur)","Zone d'exclusion balisée : périmètre = hauteur levage + 1 m minimum","Aucune personne dans la zone d'exclusion pendant le levage","Signaleur positionné : visibilité complète sur la charge et le grutier","Cordes de guidage attachées à la charge (éviter balancement)","Centre de gravité identifié – charge centrée sous le crochet","Pour levage critique : plan de levage approuvé par ingénieur"]},{"t":"D – PROCÉDURE DE LEVAGE","items":["Décollage à 5 cm : arrêt et vérification équilibre avant montée","Vitesse réduite pendant toute l'opération","Communication exclusive par signaux radio ou gestes codifiés","Pas de personne sous la charge à aucun moment","En cas de doute ou perte de signal : ARRÊT IMMÉDIAT","Dépose sur support stable et rigide avant désélingage"]}]},"FIAC-007":{"titre":"Manipulation de produits chimiques","risque":"TOUJOURS CONSULTER LA FICHE DE DONNÉES DE SÉCURITÉ (FDS) AVANT TOUTE UTILISATION","sections":[{"t":"A – PRÉREQUIS","items":["Fiche de Données de Sécurité (FDS) disponible et consultée avant utilisation","FDS datant de moins de 3 ans (version à jour)","Produit autorisé sur le site (liste des produits approuvés vérifiée)","Formation à la manipulation du produit reçue par tous les intervenants"]},{"t":"B – EPI CHIMIQUES (selon FDS)","items":["Gants de protection chimique adaptés (nitrile, néoprène selon produit)","Lunettes de protection étanches (risque projection)","Tablier chimique si risque de projection importante","Masque respiratoire adapté : □ FFP3 □ Demi-masque A2P3 □ Adduction air","Combinaison chimique si produit très toxique (section 8 FDS)","Chaussures de sécurité (résistance chimique selon FDS)"]},{"t":"C – CONDITIONS DE TRAVAIL","items":["Zone de travail ventilée (VMC ou ventilation naturelle suffisante)","Bac de rétention en place sous le contenant (volume ≥ volume produit)","Matériel de dépollution disponible à portée : absorbants, sac rouge","Douche et rince-œil d'urgence accessible dans les 10 secondes","Aucune source d'ignition à proximité si produit inflammable (FDS section 9)","Interdit de manger, boire, fumer dans la zone de manipulation"]},{"t":"D – PENDANT LA MANIPULATION","items":["Produit transvasé doucement (éviter projections et aérosols)","Contenants fermés dès que possible","Étiquetage de tout contenant intermédiaire (produit + danger + date)","En cas de projection sur peau : rincer abondamment à l'eau 15 minutes minimum","En cas d'inhalation : air frais immédiatement, consultation médicale"]},{"t":"E – APRÈS UTILISATION / STOCKAGE","items":["Contenants refermés hermétiquement","Retour en zone de stockage DIS dédiée (ventilée, étiquetée)","Chiffons ou absorbants souillés : sac rouge DIS fermé","EPI chimiques décontaminés ou mis en DIS si non réutilisables","Registre des déchets mis à jour"]}]},"FIAC-008":{"titre":"Entrée en espace confiné","risque":"NE JAMAIS ENTRER DANS UN ESPACE CONFINÉ SANS PERMIS ET MESURES ATMOSPHÉRIQUES","sections":[{"t":"A – PRÉREQUIS","items":["Permis Espace Confiné émis et signé (PTW orange)","Consignation de toutes les sources d'énergie de l'espace (LOTO)","Ventilation de l'espace : minimum 15 minutes avant entrée","Gardien formé et positionné à l'extérieur de l'espace","Communication radio testée entre intervenant et gardien","Équipement de sauvetage en place : treuil + harnais + ARI si classe 2"]},{"t":"B – MESURES ATMOSPHÉRIQUES OBLIGATOIRES","items":["Détecteur multigaz 4 en 1 testé et calibré (calibration < 6 mois)","O₂ : 19,5% – 23,5% : □ VALEUR MESURÉE : _______%","CO : < 25 ppm : □ VALEUR MESURÉE : _______ppm","H₂S : < 10 ppm : □ VALEUR MESURÉE : _______ppm","LEL (gaz explosifs) : < 10% : □ VALEUR MESURÉE : _______%","Mesures effectuées en 3 points : haut, milieu, bas de l'espace"]},{"t":"C – EPI ESPACE CONFINÉ","items":["Harnais anti-chute complet relié au treuil de sauvetage","Éclairage ATE fil conforme, absence de fissure visible","Boîtes d'essieux : pas de fuite, température normale au toucher","Ressorts de suspension : intégrité, aucun cassé","Amortisseurs : état visible, pas de fuite d'huile"]},{"t":"E – INSPECTION FREINAGE","items":["Semelles de frein : épaisseur dans la tolérance, pas de craquelure","Timonerie de frein : guidages propres, articulations lubrifiées","Cylindres de frein : pas de fuite d'air, course dans les limites","Robinets d'isolement : position correcte, fonctionnement vérifié"]},{"t":"F – INSPECTION BENNE / CAISSE (wagons minéraliers)","items":["État intérieur de la benne : absence de déformation majeure","Portes de déchargement : charnières, verrouillages, joints","Systèmes de commande de benne : actionnement correct","Absence de résidus de minerai pouvant compromettre la structure"]}]},"FIAC-012":{"titre":"Nettoyage et dégraissage des wagons","risque":"LES DÉGRAISSANTS SONT INFLAMMABLES ET IRRITANTS – EPI COMPLETS ET FDS OBLIGATOIRES","sections":[{"t":"A – PRÉREQUIS","items":["FDS du produit consultée et disponible sur le poste","Produit sur liste autorisée LAGUIPRES SIMANDOU SARLU / CTG","Zone de nettoyage ventilée (VMC ou ouverture naturelle)","Aucune source d'ignition dans la zone si dégraissant inflammable","Bac de rétention en place sous le wagon"]},{"t":"B – EPI NETTOYAGE / DÉGRAISSAGE","items":["Gants nitrile épaisseur ≥ 0,3 mm (résistance aux dégraissants)","Lunettes de protection étanches (risque projection)","Tablier chimique si usage important de produit","Masque FFP3 ou demi-masque A2 si vapeurs significatives","Chaussures de sécurité avec semelle résistant aux hydrocarbures"]},{"t":"C – PENDANT LE NETTOYAGE","items":["Application du dégraissant : pulvérisateur ou chiffon (pas d'immersion)","Pas de jet haute pression sans EPI complets","Les eaux de rinçage sont collectées (pas de rejet direct sol ou cours d'eau)","Chiffons souillés : sac rouge DIS fermé hermétiquement","Aucun fumeur dans la zone de dégraissage"]},{"t":"D – GESTION DES DÉCHETS","items":["Eaux de lavage : collecte dans fût étiqueté 'EAUX HUILEUSES – DIS'","Chiffons et absorbants souillés : sac DIS rouge","Contenants vides de produits chimiques : selon FDS (recyclage ou DIS)","Registre des déchets mis à jour"]}]}};

function nid(p){return p+"-"+today().replace(/-/g,"")+"-"+rnd()}
function nkey(p){return p+"-"+Date.now().toString(36)+"-"+rnd()}
function kinds(k){return all().filter(function(c){return c.kind===k&&!c.archived}).sort(function(a,b){return b.date.localeCompare(a.date)})}
function findById(id){return all().filter(function(c){return c.id===id})[0]}
function ftitle(code){return FIAC[code]?code+" – "+FIAC[code].titre:code}
function nowLocal(){var d=new Date();return today()+"T"+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function lvlR(r){return r<=3?"Acceptable":r<=6?"Faible":r<=12?"Modérée":r<=20?"Élevée":"Critique"}
function bdg(t,c){return'<span class="b '+(c||"")+'"'+(c?'':' style="background:#7a8794"')+'>'+esc(t)+'</span>'}
function n15(s){return[1,2,3,4,5].map(function(i){return'<option'+(+s===i?" selected":"")+'>'+i+'</option>'}).join("")}
function br(t){return esc(t||"").replace(/\n/g,"<br>")}
function vMod(){var t=[["acts","Activités"],["ptw","Permis (PTW)"],["fiches","Fiches de travail"]].map(function(x){return'<button class="'+(modSub===x[0]?"on":"g")+'" onclick="modSub=\''+x[0]+'\';modSel=null;fd=null;pd=null;render()">'+x[1]+'</button>'}).join(" ");

async function saveAct(){var c={key:nkey("act"),id:nid("ACT"),kind:"activite",mission:MISSIONS[0],site:SITE_W,type:"Activité",state:0,g:1,p:1,acts:[],faits:"",ana:"",fiac:v("fa-fiac"),date:v("fa-date"),zone:v("fa-zone").trim(),resp:v("fa-resp").trim(),equipe:v("fa-eq").trim(),desc:v("fa-desc").trim(),statut:0,ptw:"",fiche:"",hist:[today()+" Planifiée"]};

+'<div class="card"><b>Permis de travail</b><div class="m">'+esc(ptwHint(c.fiac))+'</div>'+(ptw?'<p>'+esc(ptw.id)+' '+bdg(PTW_STAT[ptw.statut])+' <button class="s g" onclick="openPtw(\''+ptw.key+'\')">Ouvrir</button></p>':'<p><button onclick="ptwFromAct()">Créer le permis</button></p>')+'</div>'

/* ===== COFFRE : données sensibles chiffrées (AES-GCM, clé dérivée d'un code) ===== */
var VK=null,VSEC={},VBUSY=false,te=new TextEncoder(),td=new TextDecoder();
function u8b64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function b64u8(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function vDerive(pass,salt){var base=await crypto.subtle.importKey("raw",te.encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64u8(salt),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function vEnc(obj){var iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},VK,te.encode(JSON.stringify(obj)));return{iv:u8b64(iv),ct:u8b64(new Uint8Array(ct))}}
async function vDec(c){var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u8(c.iv)},VK,b64u8(c.ct));return JSON.parse(td.decode(pt))}

if(vaultRec()){toast("Un coffre existe déjà.");return}
var salt=u8b64(crypto.getRandomValues(new Uint8Array(16)));VK=await vDerive(p1,salt);var chk=await vEnc({ok:"LAG"});
var c={key:"vault-main",id:"COFFRE",kind:"vault",date:"2026-01-01T00:00",type:"Coffre",site:"—",state:0,g:1,p:1,acts:[],hist:[],faits:"",ana:"",salt:salt,iv:chk.iv,ct:chk.ct};

/* --- corridor : synthèse mensuelle (FRM-012) --- */
function vSynt(){var m=hseMonth,lock=!VK,Y=m.slice(0,4),R=function(mod){return hRecs(mod).filter(function(c){return c.perim==="cor"})},
inM=function(L,mm){return L.filter(function(c){return String(c.date).slice(0,7)===mm})},M=function(mod){return inM(R(mod),m)},
mon=function(n){var d=new Date(m+"-01");d.setMonth(d.getMonth()-n);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)},
win=function(ms){var hh=0,at=0,j=0;ms.forEach(function(mm){inM(R("heur"),mm).forEach(function(c){hh+=(+c.v.nag||0)*(+c.v.hrs||0)});inM(R("icor"),mm).forEach(function(c){if(c.v.type==="Accident"&&c.v.arret==="OUI"){at++;j+=+c.v.jarret||0}})});return{hh:hh,at:at,j:j,tf:hh?at*1e6/hh:null,tg:hh?j*1000/hh:null}},
ytd=[];for(var i=1;i<=+m.slice(5,7);i++)ytd.push(Y+"-"+("0"+i).slice(-2));
var W=[["Mois "+m,win([m])],["3 derniers mois",win([mon(2),mon(1),m])],["Cumul "+Y,win(ytd)]],
jp=M("jpat"),days={},ag={},km=0;jp.forEach(function(c){days[String(c.date).slice(0,10)]=1;String(c.v.compo||"").split(/[\n,;]+/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(x){ag[x]=1});km+=+c.v.kmv||0});
var ic=M("icor"),ct=function(t){return ic.filter(function(c){return c.v.type===t}).length},f2=function(x){return x==null?"—":(Math.round(x*100)/100).toLocaleString("fr-FR")},
L=function(v){return lock?"🔒":v},ff=M("ffw"),ctr=0,ina=0;ff.forEach(function(c){nrows(c,"ag").forEach(function(r){ctr++;if(r.apt==="NON")ina++})});
var hy=0;M("hyd").forEach(function(c){hy+=+c.v.cas||0});var pc=0;M("palu").forEach(function(c){pc+=+c.v.conf||0});var ev=0;M("ps").forEach(function(c){if(c.v.ev==="OUI")ev+=(+c.v.evn||1)});var ab=0;M("abs").forEach(function(c){ab+=+c.v.jours||0});
var cm=M("comm"),pl=cm.filter(function(c){return c.v.typ==="Plainte formelle"}),fo=M("form"),fa=0;fo.forEach(function(c){fa+=+c.v.pres||nrows(c,"pa").length});
var rows=[["Jours de patrouille effectués",Object.keys(days).length],["Agents déployés (total)",Object.keys(ag).length],["Heures-hommes travaillées",f2(W[0][1].hh)],["Km parcourus (véhicule)",km],["Contrôles FFW réalisés",L(ctr)],["Agents déclarés inaptes",L(ina)],["Accidents du travail",ct("Accident")],["Presqu'accidents enregistrés",ct("Presqu'accident")],["Incidents sécurité",ct("Incident sécurité")],["Incidents sûreté",ct("Incident sûreté")],["Incidents VPSHR",L(M("vpshr").length)],["Cas de paludisme confirmés",L(pc)],["Cas de stress thermique",L(hy)],["Évacuations médicales",L(ev)],["Jours d'absence (maladie / accident du travail)",L(ab)],["Incidents communautaires",ct("Communautaire")],["Plaintes reçues",L(pl.length)],["Plaintes résolues",L(pl.filter(function(c){return c.st===1}).length)],["Sessions de formation réalisées",fo.length],["Agents formés",fa]];
return'<div class="card"><div class="row"><div><label>Mois</label><input type="month" value="'+m+'" onchange="hseMonth=this.value;render()"></div><div><button class="g" style="margin-top:22px" onclick="window.print()">Imprimer</button></div></div>'+(lock?'<p class="m">🔒 Les indicateurs marqués d\'un cadenas viennent de données chiffrées : déverrouillez le coffre (dans un module sensible, par exemple FFW) pour les afficher.</p>':'')
+'<div class="tw"><table class="k"><tr><th>Indicateur</th><th>Valeur</th></tr>'+rows.map(function(r){return'<tr><td>'+esc(r[0])+'</td><td>'+r[1]+'</td></tr>'}).join("")+'</table></div></div>'
+'<div class="card"><b>Taux de fréquence et de gravité</b><div class="tw"><table class="k"><tr><th>Fenêtre</th><th>Heures-hommes</th><th>Accidents avec arrêt</th><th>Jours d\'arrêt</th><th>TF</th><th>TG</th></tr>'+W.map(function(w){var x=w[1];return'<tr><td>'+w[0]+'</td><td>'+f2(x.hh)+'</td><td>'+x.at+'</td><td>'+x.j+'</td><td'+(x.tf>0?' class="red"':'')+'>'+f2(x.tf)+'</td><td'+(x.tg>0?' class="red"':'')+'>'+f2(x.tg)+'</td></tr>'}).join("")+'</table></div><p class="m">TF = accidents avec arrêt × 1 000 000 / heures-hommes ; TG = jours d\'arrêt × 1 000 / heures-hommes. Les heures viennent de l\'onglet Heures (agents présents × heures par agent).</p></div>'}

/* --- wagons : documents de référence --- */
var DOCS={pol:{t:"Politique HSE (LAG-SIM-HSE-POL-001)",h:'<p>La Direction Générale de Laguipres Simandou SARLU place la protection des personnes, la préservation de l\'environnement et l\'excellence opérationnelle au cœur de ses activités sur le projet Simandou (CTG), avec un système de management conforme à ISO 45001:2018 et ISO 14001:2015.</p><p><b>Principes</b> : aucune tâche n\'est urgente au point de compromettre la sécurité ; droit de retrait face à un risque inacceptable ; signalement immédiat de tout incident sans crainte de représailles ; port des EPI obligatoire et non négociable ; visites médicales périodiques ; tout déversement accidentel contenu et notifié immédiatement ; respect des lois guinéennes HSE et des standards CTG ; retour d\'expérience après chaque incident ou quasi-incident.</p><p><b>Objectifs</b> : 0 fatalité · 0 accident avec arrêt (TF1) · 0 incident environnemental majeur · 100 % des travailleurs formés · au moins 4 causeries par équipe et par mois · au moins 8 inspections terrain par mois.</p><p><b>Responsabilités</b> : la Direction Générale approuve et alloue les ressources ; le Directeur HSE pilote le système de management ; les chefs de chantier appliquent et font appliquer ; les travailleurs respectent les consignes et signalent les dangers.</p>'},
duerp:{t:"Évaluation des risques (DUERP, 14 risques)",h:"<p class=\"m\">Grille 5×5 (probabilité × gravité). Barème du document : 1-3 acceptable · 4-6 faible · 7-12 modéré · 13-20 élevé · 21-25 critique. Les niveaux ci-dessous sont recopiés tels qu'ils figurent dans le registre.</p><div class=\"tw\"><table class=\"k\" style=\"text-align:left\"><tr><th>N°</th><th>Activité</th><th>Danger</th><th>P</th><th>G</th><th>Risque brut</th><th>Mesures de prévention</th><th>P'</th><th>G'</th><th>Risque résiduel</th></tr><tr><td>R01</td><td>Déplacement wagons</td><td>Écrasement membre</td><td>3</td><td>5</td><td>15 – ÉLEVÉ</td><td>LOTO ferroviaire, zone d'exclusion 3 m, PTW, sentinelles</td><td>1</td><td>4</td><td>4 – FAIBLE</td></tr><tr><td>R02</td><td>Travail sous wagon (fosses / vérins)</td><td>Chute de charge</td><td>2</td><td>5</td><td>10 – MODÉRÉ</td><td>Vérins certifiés, cales mécaniques, PTW fosse, inspection</td><td>1</td><td>4</td><td>4 – FAIBLE</td></tr><tr><td>R03</td><td>Toiture wagons (hauteur &gt; 3 m)</td><td>Chute de hauteur</td><td>3</td><td>5</td><td>15 – ÉLEVÉ</td><td>Harnais EN 361, ligne de vie inox, PTW hauteur, météo</td><td>1</td><td>3</td><td>3 – FAIBLE</td></tr><tr><td>R04</td><td>Soudure / meulage</td><td>Projection, brûlure</td><td>4</td><td>3</td><td>12 – ÉLEVÉ</td><td>Écran de protection, EPI thermiques, permis feu, périmètre</td><td>2</td><td>2</td><td>4 – FAIBLE</td></tr><tr><td>R05</td><td>Travaux électriques HT</td><td>Électrocution, arc</td><td>2</td><td>5</td><td>10 – MODÉRÉ</td><td>Consignation LOTO, habilitation HT, gants cl. 2, visière</td><td>1</td><td>5</td><td>5 – MODÉRÉ</td></tr><tr><td>R06</td><td>Circulation ferrée active</td><td>Heurt par wagon</td><td>3</td><td>5</td><td>15 – ÉLEVÉ</td><td>Fenêtre travaux CTG, sentinelles, autorisation voie, gilet HV</td><td>1</td><td>5</td><td>5 – MODÉRÉ</td></tr><tr><td>R07</td><td>Espace confiné (soutes wagons)</td><td>Asphyxie / gaz toxique</td><td>2</td><td>5</td><td>10 – MODÉRÉ</td><td>Détecteur 4 gaz, permis confiné, gardien, ventilation forcée, ARI</td><td>1</td><td>5</td><td>5 – MODÉRÉ</td></tr><tr><td>R08</td><td>Levage / grutage</td><td>Chute de charge</td><td>2</td><td>5</td><td>10 – MODÉRÉ</td><td>Élingues certifiées, zone d'exclusion, signaleur, PTW</td><td>1</td><td>4</td><td>4 – FAIBLE</td></tr><tr><td>R09</td><td>Produits chimiques</td><td>Intoxication, brûlure</td><td>3</td><td>3</td><td>9 – MODÉRÉ</td><td>FDS affichée, EPI chimiques, stockage ventilé, bac de rétention</td><td>2</td><td>2</td><td>4 – FAIBLE</td></tr><tr><td>R10</td><td>Bruit / vibrations (&gt; 85 dB)</td><td>Surdité professionnelle</td><td>4</td><td>3</td><td>12 – ÉLEVÉ</td><td>Bouchons SNR ≥ 28 dB, rotation des postes, audiogramme annuel</td><td>2</td><td>2</td><td>4 – FAIBLE</td></tr><tr><td>R11</td><td>Chaleur extrême (Guinée &gt; 35 °C)</td><td>Coup de chaleur</td><td>4</td><td>3</td><td>12 – ÉLEVÉ</td><td>Hydratation 3 L/j, rotations obligatoires, surveillance médicale</td><td>2</td><td>2</td><td>4 – FAIBLE</td></tr><tr><td>R12</td><td>Manutention manuelle</td><td>TMS, lombalgie</td><td>4</td><td>2</td><td>8 – MODÉRÉ</td><td>Formation gestes et postures, aides mécaniques, rotation</td><td>2</td><td>2</td><td>4 – FAIBLE</td></tr><tr><td>R13</td><td>Gestion des huiles usées</td><td>Pollution sol / eau</td><td>3</td><td>3</td><td>9 – MODÉRÉ</td><td>Bacs de rétention, fûts hermétiques, BSD</td><td>1</td><td>2</td><td>2 – ACCEPTABLE</td></tr><tr><td>R14</td><td>Incendie atelier</td><td>Destruction / blessures</td><td>3</td><td>4</td><td>12 – ÉLEVÉ</td><td>Extincteurs, détection fumée, exercice d'évacuation trimestriel</td><td>1</td><td>3</td><td>3 – FAIBLE</td></tr></table></div><p><b>Plan d'action prioritaire (risques résiduels « modérés »)</b></p><div class=\"tw\"><table class=\"k\" style=\"text-align:left\"><tr><th>Risque</th><th>Action complémentaire</th><th>Responsable</th><th>Délai</th></tr><tr><td>R05 Électrique HT</td><td>Formation de recyclage de l'habilitation HT semestrielle + vérification des EPI isolants à chaque PTW</td><td>Directeur HSE</td><td>Permanent</td></tr><tr><td>R06 Circulation ferrée</td><td>Revue mensuelle de la procédure fenêtre travaux CTG + briefing avant chaque accès voie</td><td>Resp. HSE + CTG</td><td>Mensuel</td></tr><tr><td>R07 Espace confiné</td><td>Simulation espace confiné semestrielle + vérification de la calibration des détecteurs à chaque entrée</td><td>Technicien HSE</td><td>Semestriel</td></tr></table></div><p class=\"m\"><b>Point à vérifier</b> : dans le registre, les scores de 12 sont libellés « élevé » alors que le barème les classe « modéré » ; les scores de 3 sont « faible » (barème : acceptable) et ceux de 5 sont « modéré » (barème : faible). L'application, pour ses propres calculs de risque, applique le barème.</p>"},atc:{t:"Tâches critiques et barrières de contrôle (ATC)",h:"<p class=\"m\">Toute tâche de ce registre exige un permis de travail avant démarrage, sans exception. Révision annuelle ou après tout incident significatif.</p><div class=\"tw\"><table class=\"k\" style=\"text-align:left\"><tr><th>N°</th><th>Tâche</th><th>Danger</th><th>Conséquence</th><th>Barrières critiques de contrôle</th><th>Responsable</th><th>Vérification</th><th>Niveau</th></tr><tr><td>TC-001</td><td>Déplacement de wagons / couplage</td><td>Écrasement, coincement</td><td>Décès, amputation</td><td><ul><li>Isolation LOTO ferroviaire obligatoire avant tout accès</li><li>Zone de sécurité balisée à 3 m de chaque côté des voies</li><li>Signalisation sonore et visuelle de tout mouvement</li><li>PTW ferroviaire obligatoire</li></ul></td><td>Chef de chantier + HSE</td><td>Inspection avant démarrage + PTW</td><td>CRITIQUE</td></tr><tr><td>TC-002</td><td>Travail sous wagon – fosses et vérins</td><td>Chute de charge, effondrement</td><td>Décès, blessure grave</td><td><ul><li>Vérins certifiés inspectés avant usage</li><li>Cales de sécurité mécaniques posées en complément</li><li>Garde-corps de fosse en place et verrouillé</li><li>PTW fosse obligatoire + contrôle atmosphérique</li></ul></td><td>Technicien HSE</td><td>Inspection journalière des vérins</td><td>ÉLEVÉ</td></tr><tr><td>TC-003</td><td>Travaux électriques (caténaire / HT)</td><td>Électrocution, arc électrique</td><td>Décès</td><td><ul><li>Consignation HT complète – procédure LOTO</li><li>Habilitation électrique HT valide obligatoire</li><li>EPI isolants : gants cl. 2, visière anti-arc, tapis</li><li>Permis électrique HT cosigné CTG</li></ul></td><td>Électricien qualifié HT</td><td>Test 0 V avant travaux + habilitation vérifiée</td><td>CRITIQUE</td></tr><tr><td>TC-004</td><td>Travaux en hauteur – toiture wagons</td><td>Chute de hauteur</td><td>Décès, blessure grave</td><td><ul><li>Harnais antichute 5 points certifié EN 361 obligatoire</li><li>Ligne de vie horizontale installée sur la toiture</li><li>Zone au sol balisée – exclusion des piétons</li><li>Permis hauteur + contrôle météo (vent &lt; 50 km/h)</li></ul></td><td>Chef d'équipe + HSE</td><td>Inspection des EPI avant travaux (7 points)</td><td>ÉLEVÉ</td></tr><tr><td>TC-005</td><td>Soudure / oxycoupage / meulage</td><td>Incendie, brûlures, fumées toxiques</td><td>Décès, blessure grave, maladie professionnelle</td><td><ul><li>Permis à feu émis et affiché</li><li>Extincteur polyvalent à 2 m du poste</li><li>EPI thermiques complets : masque, tablier, gants</li><li>Ventilation forcée en espace semi-fermé</li></ul></td><td>Chef de chantier</td><td>Inspection du poste de soudure quotidienne</td><td>ÉLEVÉ</td></tr><tr><td>TC-006</td><td>Manipulation de produits chimiques</td><td>Intoxication, incendie, explosion</td><td>Blessure, décès, pollution</td><td><ul><li>FDS disponible et affichée</li><li>EPI chimiques : masque A2P3, gants nitrile, lunettes</li><li>Local ventilé – stockage en armoire dédiée</li><li>Bac de rétention obligatoire sous tout stockage</li></ul></td><td>Magasinier / HSE</td><td>Vérification FDS et stockage mensuelle</td><td>MODÉRÉ</td></tr><tr><td>TC-007</td><td>Levage / élingage – ponts et grues</td><td>Chute de charge, écrasement</td><td>Décès, blessure grave</td><td><ul><li>Élingues et accessoires de levage certifiés et inspectés</li><li>Zone d'exclusion balisée sous charge pendant toute la levée</li><li>Signaleur qualifié désigné et équipé d'une radio</li><li>PTW levage + charge maximale affichée sur l'élingue</li></ul></td><td>Grutier + HSE</td><td>Inspection des élingues avant utilisation (visuelle + registre)</td><td>CRITIQUE</td></tr><tr><td>TC-008</td><td>Circulation ferrée – exposition à la voie</td><td>Heurt par wagon ou locomotive</td><td>Décès</td><td><ul><li>Fenêtre de travaux définie et validée par CTG Opérations</li><li>Sentinelles positionnées aux deux extrémités de la zone</li><li>Port du gilet haute visibilité obligatoire sur toute voie</li><li>Autorisation d'accès voie cosignée Resp. voie + HSE</li></ul></td><td>Responsable voie + HSE</td><td>Briefing obligatoire avant chaque intervention</td><td>CRITIQUE</td></tr><tr><td>TC-009</td><td>Travail en espace confiné – soutes wagons</td><td>Asphyxie, intoxication par gaz</td><td>Décès</td><td><ul><li>Mesure atmosphérique (O₂, CO, H₂S, LEL) avant entrée</li><li>Permis espace confiné émis et affiché</li><li>Gardien désigné et présent en permanence à l'extérieur</li><li>Ventilation mécanique forcée – ARI disponible</li></ul></td><td>Technicien HSE</td><td>Test de l'atmosphère avant entrée + toutes les 30 min</td><td>CRITIQUE</td></tr><tr><td>TC-010</td><td>Bruit / vibrations – meulage, sablage</td><td>Surdité professionnelle irréversible</td><td>Invalidité professionnelle</td><td><ul><li>Bouchons moulés SNR ≥ 28 dB ou casque antibruit SNR ≥ 30 dB</li><li>Rotation des postes bruyants (4 h consécutives maximum)</li><li>Audiogramme annuel obligatoire – résultat archivé</li><li>Mesure sonométrique mensuelle des postes</li></ul></td><td>Chef d'équipe + médecin</td><td>Audiogramme annuel + vérification des EPI mensuelle</td><td>MODÉRÉ</td></tr></table></div><p><b>Types de permis de travail</b></p><div class=\"tw\"><table class=\"k\" style=\"text-align:left\"><tr><th>Permis</th><th>Travaux concernés</th><th>Tâches critiques</th><th>Cosignataires requis</th></tr><tr><td>Général</td><td>Toutes activités de maintenance courante</td><td>TC-002, TC-006, TC-010</td><td>Superviseur + HSE</td></tr><tr><td>Travail à chaud</td><td>Soudure, oxycoupage, meulage à étincelles</td><td>TC-005</td><td>Chef de chantier + HSE + extincteur</td></tr><tr><td>Travail en hauteur</td><td>Tout travail > 1,80 m – toiture wagons</td><td>TC-004</td><td>Chef d'équipe + HSE + météo</td></tr><tr><td>Espace confiné</td><td>Entrée soutes wagons / fosses profondes</td><td>TC-009</td><td>HSE + gardien désigné + mesure de gaz</td></tr><tr><td>Électrique HT/BT</td><td>Consignations et travaux électriques</td><td>TC-003</td><td>Électricien habilité + CTG</td></tr><tr><td>Ferroviaire</td><td>Travaux sur voie active / déplacement de wagons</td><td>TC-001, TC-008</td><td>Resp. voie + HSE + CTG Opérations</td></tr><tr><td>Levage</td><td>Grutage, élingage, levée de charges lourdes</td><td>TC-007</td><td>Grutier habilité + HSE + signaleur</td></tr></table></div><p class=\"m\"><b>Point à vérifier</b> : le formulaire de permis (FIC-002) ne propose pas de case pour les permis ferroviaire et levage, alors que l'ATC les exige. L'application les propose.</p>"},
proc:{t:"Procédures (PROC-001 à 007)",h:"<details style=\"margin:6px 0\"><summary><b>PROC-001 – Permis de travail (PTW)</b></summary><ul><li><b>Objet</b> : émission, validation, suivi et clôture des permis pour toutes les tâches à risque ; le PTW garantit l'analyse préalable des risques et les mesures de prévention avant tout démarrage.</li><li><b>Étapes</b> : 1) le superviseur identifie la tâche critique et rédige la JSA (FIC-004) ; 2) il remplit le PTW (FIC-002) ; 3) le technicien HSE valide la complétude ; 4) le chef de chantier approuve et contresigne ; 5) briefing de l'équipe devant le poste, chaque agent signe ; 6) le PTW est affiché sur le poste pendant les travaux ; 7) renouvellement si interruption de plus de 30 min ou changement d'équipe ; 8) clôture cosignée superviseur + HSE avec vérification de la restitution de l'outillage.</li><li><b>Règle cardinale</b> : aucun travail critique sans PTW signé et affiché.</li><li>Un PTW est valable un poste de travail au maximum. En cas d'accident ou d'événement grave, travaux suspendus et PTW clôturé. Archivage 5 ans minimum.</li></ul></details><details style=\"margin:6px 0\"><summary><b>PROC-002 – Consignation / déconsignation (LOTO)</b></summary><ul><li><b>Règle cardinale</b> : toute violation entraîne une mesure disciplinaire immédiate.</li><li><b>Consignation en 7 étapes</b> : notifier · identifier les sources d'énergie · isoler · cadenasser (cadenas personnel, par l'intervenant seul) · étiqueter « DANGER – DO NOT OPERATE » · purger l'énergie résiduelle · vérifier (essai de démarrage et tension 0 V au voltmètre).</li><li><b>Déconsignation</b> : retirer les outils et dégager la zone ; chaque intervenant retire seulement son cadenas ; vérifier que tout le personnel est en zone sécurisée ; notifier la fin des travaux ; remise en service progressive.</li><li>Un intervenant = un cadenas personnel. Perte d'un cadenas : procédure d'urgence avec le Directeur HSE et le chef de chantier.</li></ul></details><details style=\"margin:6px 0\"><summary><b>PROC-003 – Travail en hauteur (&gt; 1,80 m)</b></summary><ul><li><b>Prérequis</b> : PTW hauteur signé · harnais vérifié (7 points) · point d'ancrage certifié ≥ 15 kN et étiqueté · longe à absorption d'énergie (< 2 m) · zone au sol balisée · formation à jour (recyclage annuel) · météo : vent < 50 km/h, pas d'orage ni de pluie battante.</li><li><b>Interdictions (faute grave)</b> : jamais sans harnais homologué et ancrage certifié ; jamais seul (binôme obligatoire) ; interdit par vent > 50 km/h, orage, pluie battante ou visibilité réduite ; interdit sur une toiture de wagon sans ligne de vie ; interdit de jeter ou passer des objets par-dessus un bord.</li><li><b>Chute</b> : déclencher l'alarme, contacter le HSE et l'infirmier ; ne pas retirer la victime sans évaluation médicale ; baliser ; déclarer l'incident (FIC-006) dans l'heure.</li></ul></details><details style=\"margin:6px 0\"><summary><b>PROC-004 – Gestion des incidents</b></summary><ul><li><b>Classification</b> : niveau 5 fatalité · 4 LTI (accident avec arrêt) · 3 MTO (traitement médical) · 2 FAC (premiers secours) · 1 presqu'accident · 0 situation dangereuse.</li><li><b>Réponse</b> : T+0 secours et sécurisation ; T+15 min alerte de la hiérarchie et du HSE, isolement de la zone ; T+1 h déclaration FIC-006 au Directeur HSE ; T+24 h rapport préliminaire (Direction HSE et CTG HSE) ; T+72 h enquête complète ; T+30 j vérification de l'efficacité des actions.</li><li><b>Notification</b> : N5 immédiat (DG + CTG + autorités guinéennes) · N4 < 1 h (Dir. HSE + DG + CTG HSE) · N3 < 4 h (Dir. HSE + chef de projet) · N2 < 24 h (Resp. HSE site + chef d'équipe) · N1 < 48 h (Resp. HSE site).</li><li>Investigation par la méthode des 5 pourquoi pour tout incident de niveau 2 et plus.</li></ul></details><details style=\"margin:6px 0\"><summary><b>PROC-005 – Urgence et évacuation</b></summary><ul><li><b>Alarme</b> : 3 sonneries longues continues = évacuation générale immédiate ; message radio « CODE ROUGE – ÉVACUATION ZONE [X] – REJOIGNEZ LE POINT [P1/P2] ». La fin d'urgence est annoncée par le Directeur de l'Urgence uniquement.</li><li><b>Rôles</b> : Directeur de l'Urgence (chef de chantier ou suppléant) · agents d'évacuation (techniciens HSE, chefs d'équipe) · secouristes SST (2 minimum par zone) · responsable communication · gardien de zone.</li><li><b>Évacuation</b> : arrêt des travaux, sortie la plus sûre, rassemblement au point PR1 ou PR2, appel nominal par les chefs d'équipe, personne ne retourne sans autorisation, ne pas déplacer une victime traumatisée.</li><li><b>Scénarios</b> : incendie / explosion (pompiers 18 / 112) · accident grave · déversement chimique majeur · incident ferroviaire (CTG Opérations) · intempérie. <b>Exercices</b> : 2 fois par an au minimum (T1 et T3).</li></ul></details><details style=\"margin:6px 0\"><summary><b>PROC-006 – Gestion des déchets</b></summary><ul><li><b>Tri</b> : dangereux (DIS) en fût hermétique rouge, prestataire agréé · métaux et ferraille en benne jaune, recyclage · recyclable propre en conteneur vert · non dangereux en poubelle grise, décharge communale.</li><li><b>Règles</b> : huiles usées en fûts hermétiques étiquetés, jamais dans le sol ni les caniveaux ; chiffons souillés = DIS ; bordereau de suivi (BSD) pour tout transfert de DIS ; bacs de rétention sous tout équipement à fluides ; aucun brûlage à l'air libre ; stockage des DIS sécurisé, couvert et ventilé.</li><li>Un déversement de DIS dans le sol ou l'eau est une infraction grave : notification immédiate. Registre des déchets mensuel, audit trimestriel, prestataires agréés par les autorités guinéennes.</li></ul></details><details style=\"margin:6px 0\"><summary><b>PROC-007 – Travail en espace confiné</b></summary><ul><li><b>Règle cardinale</b> : aucune entrée sans permis signé et mesure atmosphérique validée.</li><li><b>Prérequis</b> : permis espace confiné · mesure avant entrée et toutes les 30 min · détecteur 4 gaz étalonné (< 6 mois) · gardien présent à l'extérieur en permanence · équipements de secours prêts (treuil d'extraction, harnais, extincteur) · ventilation mécanique forcée · formation à jour.</li><li><b>Seuils</b> (normal / alarme 1 / alarme 2 = évacuation) : O₂ 19,5-23 % / hors de 19,5-23 % / < 18 % ou > 24 % · CO < 25 ppm / 25-50 / > 50 · H₂S < 10 ppm / 10-15 / > 15 · gaz inflammables < 10 % LIE / 10-20 / > 20 %.</li><li><b>Interdictions</b> : entrer sans permis et mesure ; tenter un sauvetage sans protection respiratoire (risque de double victime) ; utiliser de l'oxygène pur pour aérer ; laisser l'espace sans surveillance si quelqu'un est à l'intérieur.</li></ul></details>"}};

function vSubBar(sub,lab){if(sub.indexOf(hseSub)<0)hseSub=sub[0];return'<div class="tabs" style="flex-wrap:wrap">'+sub.map(function(k){return'<button class="'+(hseSub===k?"on":"g")+'" onclick="hseGo(\''+k+'\')">'+esc(lab[k])+'</button>'}).join("")+'</div>'}
function vReu(){var sub=["reunion","formation","recyc","obj"];return vSubBar(sub,{reunion:"Réunions",formation:"Formations",recyc:"Échéances de recyclage",obj:"Synthèse"})+(hseSub==="recyc"?vRecyc():hseSub==="obj"?vReuObj():vHMod(hseSub))}
function vDirTab(){var sub=["doc","ao","obj"];return vSubBar(sub,{doc:"Documents HSE",ao:"Appels d'offre",obj:"Synthèse"})+(hseSub==="obj"?vDirObj():vHMod(hseSub))}
function vRecyc(){var best={};hRecs("formation").forEach(function(c){if(c.st>1)return;nrows(c,"pa").forEach(function(r){if(r.m&&r.v&&r.r==="Réussi"){var th=c.v.th==="Autre"?c.v.autre:c.v.th,k=r.m+"|"+th;if(!best[k]||r.v>best[k].v)best[k]={m:r.m,th:th,v:r.v}}})});
var L=Object.keys(best).map(function(k){var b=best[k];b.d=dDiff(b.v);return b}).filter(function(b){return b.d<=90}).sort(function(a,b){return a.d-b.d});
return'<div class="card"><b>'+L.length+'</b> validité(s) expirée(s) ou arrivant à échéance dans les 90 jours</div>'+(L.length?'<div class="card"><div class="tw"><table class="k" style="text-align:left"><tr><th>Matricule</th><th>Formation</th><th>Valable jusqu\'au</th><th>État</th></tr>'+L.map(function(b){return'<tr><td>'+esc(b.m)+'</td><td>'+esc(b.th)+'</td><td>'+esc(b.v)+'</td><td>'+(b.d<0?bdg("expirée depuis "+(-b.d)+" j","Critique"):bdg("dans "+b.d+" j","Modérée"))+'</td></tr>'}).join("")+'</table></div><p class="m">Seule la validité la plus récente de chaque agent et de chaque formation est retenue : un recyclage déjà fait retire l\'alerte.</p></div>':'<div class="card m">Rien à recycler dans les 90 jours.</div>')}

var rN=R.filter(function(c){return c.st!==2}),fN=F.filter(function(c){return c.st<2}),rT=R.filter(function(c){return c.st===1}),fR=F.filter(function(c){return c.st===1}),pf=0,rs=[];
fR.forEach(function(c){pf+=nrows(c,"pa").filter(function(r){return r.m&&r.r!=="Absent"}).length;if(+c.v.pres>0&&c.v.reu!=="")rs.push(+c.v.reu*100/+c.v.pres)});
var op=0,late=0;hRecs("reunion").forEach(function(c){(c.acts||[]).forEach(function(a){if(!a.done){op++;if(a.due<today())late++}})});
var soon=function(L,t){return L.filter(function(c){return c.st===0&&String(c.date).slice(0,10)>=today()&&dDiff(String(c.date).slice(0,10))<=30}).map(function(c){return'<div class="m">• '+esc(String(c.date).replace("T"," "))+' · '+esc(HM[t].ti(c))+'</div>'}).join("")},pc=function(a,b){return b?Math.round(a*100/b)+" %":"—"};
return'<div class="card"><div class="row"><div><label>Mois</label><input type="month" value="'+m+'" onchange="hseMonth=this.value;render()"></div></div><div class="tw"><table class="k"><tr><th>Indicateur</th><th>Valeur</th></tr><tr><td>Réunions tenues / prévues (hors annulées)</td><td>'+rT.length+' / '+rN.length+' ('+pc(rT.length,rN.length)+')</td></tr><tr><td>Formations réalisées / prévues (hors reportées et annulées)</td><td>'+fR.length+' / '+fN.length+' ('+pc(fR.length,fN.length)+')</td></tr><tr><td>Participants aux formations réalisées</td><td>'+pf+'</td></tr><tr><td>Taux de réussite moyen</td><td>'+(rs.length?Math.round(rs.reduce(function(a,b){return a+b},0)/rs.length)+" %":"—")+'</td></tr><tr><td>Actions de réunion ouvertes (toutes dates) / en retard</td><td>'+op+' / <span'+(late?' class="red"':'')+'>'+late+'</span></td></tr></table></div>'
+'<p><b>À venir dans les 30 jours</b></p>'+(soon(hRecs("reunion"),"reunion")+soon(hRecs("formation"),"formation")||'<div class="m">Rien de planifié.</div>')+'</div>'}
function vDirObj(){var D=hRecs("doc"),A=hRecs("ao"),by=function(L,i){return L.filter(function(c){return(c.st||0)===i}).length},ech=D.filter(function(c){return(c.st||0)<5&&dDiff(c.v.rev)!=null&&dDiff(c.v.rev)<0}),pro=D.filter(function(c){return(c.st||0)<5&&dDiff(c.v.rev)!=null&&dDiff(c.v.rev)>=0&&dDiff(c.v.rev)<=30});

var up=A.filter(function(c){return(c.st||0)<2&&dDiff(c.v.dlim)!=null&&dDiff(c.v.dlim)>=0&&dDiff(c.v.dlim)<=30}).sort(function(a,b){return a.v.dlim<b.v.dlim?-1:1});

+'<div class="card"><b>Appels d\'offre</b><div class="tw"><table class="k"><tr><th>Total</th><th>Identifiés</th><th>En préparation</th><th>Soumis</th><th>Gagnés</th><th>Perdus</th><th>Abandonnés</th><th>Taux de succès</th></tr><tr><td>'+A.length+'</td>'+[0,1,2,3,4,5].map(function(i){return'<td>'+by(A,i)+'</td>'}).join("")+'<td>'+tx+'</td></tr></table></div><p class="m">Taux de succès = gagnés / (gagnés + perdus). Montants gagnés : '+(Object.keys(gm).map(function(d){return(Math.round(gm[d])).toLocaleString("fr-FR")+" "+d}).join(" · ")||"—")+'</p>'+(up.length?'<p><b>Remises à venir (30 jours)</b></p>'+up.map(function(c){return'<div class="m">• '+esc(c.v.dlim)+' · '+esc(c.v.ref)+' · '+esc(c.v.cli)+'</div>'}).join(""):'')+'</div>'}
