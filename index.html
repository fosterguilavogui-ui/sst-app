var DOC_BODY={"LAG-SIM-HSE-POL-001": "## 1. ENGAGEMENT DE LA DIRECTION ET MISSION\nLa Direction Générale de Laguipres Simandou SARLU, filiale de Laguipres SAU, place la protection des personnes, la préservation de l'environnement et l'excellence opérationnelle au cœur de ses activités sur le projet Simandou (CTG), dans la continuité des exigences du Groupe.\nNotre mission : assurer la sécurité des personnes, des biens et de l'environnement par des solutions de prévention fiables, conformes et durables.\nZéro accident, zéro blessure grave, zéro impact environnemental négatif évitable : nos objectifs fondamentaux et non négociables, portés par un système de management conforme aux normes ISO 45001:2018 (SST) et ISO 14001:2015 (Environnement).\n## 2. NOS PRINCIPES FONDAMENTAUX\nSécurité des personnes\n- Aucune tâche n'est urgente au point de compromettre la sécurité\n- Droit de retrait face à un risque inacceptable\n- Signalement immédiat de tout incident, sans crainte de représailles\n- Port des EPI : obligatoire et non négociable\nSanté au travail\n- Identification, évaluation et contrôle des risques santé\n- Visites médicales périodiques des travailleurs exposés\n- Prévention active de la fatigue, du stress et des maladies professionnelles\nProtection de l'environnement\n- Minimisation des impacts : déchets, déversements, émissions\n- Tout déversement accidentel est contenu et notifié immédiatement\n- Réglementation guinéenne respectée et intégrée\nConformité légale et réglementaire\n- Respect des lois guinéennes HSE en vigueur\n- Standards HSE CTG / Simandou pleinement intégrés\n- Référentiels ISO 45001 (SST) et ISO 14001 (Environnement) appliqués\nAmélioration continue\n- Retour d'expérience (REX) systématique après chaque incident ou quasi-incident\n- Revue périodique des indicateurs et actualisation des objectifs HSE\n- Mise à jour du système de management, en cohérence avec la politique du Groupe Laguipres SAU\n## 3. OBJECTIFS HSE\n| Objectif | Indicateur | Cible |\n| Accidents mortels (fatalités) | Nombre de fatalités | 0 |\n| Accidents avec arrêt (LTI) | Taux de fréquence TF1 | 0 |\n| Incidents environnementaux | Déversements majeurs | 0 |\n| Formation HSE | % de travailleurs formés | 100 % |\n| Causeries HSE | Fréquence par équipe et par mois | ≥ 4 |\n| Inspections terrain | Nombre par mois | ≥ 8 |\n## 4. RESPONSABILITÉS\n- Direction Générale : approuve la politique et alloue les ressources.\n- Directeur HSE : pilote le système de management HSE, coordonne audits et inspections.\n- Chefs de chantier : appliquent et font appliquer les règles HSE.\n- Travailleurs : respectent les consignes et signalent les dangers.\nLa Direction Générale s'engage à mobiliser les moyens nécessaires à l'application de cette politique et appelle l'ensemble du personnel du projet Simandou à une implication active.", "LAG-SIM-HSE-DUERP-001": "## 1. CONTEXTE ET PÉRIMÈTRE\nDocument établi conformément au Code du Travail de la République de Guinée et aux exigences de la norme ISO 45001:2018. Il couvre l'ensemble des activités de maintenance des wagons réalisées par Laguipres Simandou SARLU, filiale de Laguipres SAU, pour le compte de CTG sur le projet Simandou.\nPérimètre d'évaluation : ateliers de maintenance, voies de service, zones de stationnement des wagons, fosses de maintenance, zones de stockage des matériaux et pièces de rechange.\n## 2. GRILLE ET REGISTRE DES RISQUES\nGrille 5×5 (probabilité × gravité). Barème du document : 1-3 acceptable · 4-6 faible · 7-12 modéré · 13-20 élevé · 21-25 critique. Les niveaux ci-dessous sont recopiés tels qu'ils figurent dans le registre.\n\n| N° | Activité | Danger | P | G | Risque brut | Mesures de prévention | P' | G' | Risque résiduel |\n| R01 | Déplacement wagons | Écrasement membre | 3 | 5 | 15 – ÉLEVÉ | LOTO ferroviaire, zone d'exclusion 3 m, PTW, sentinelles | 1 | 4 | 4 – FAIBLE |\n| R02 | Travail sous wagon (fosses / vérins) | Chute de charge | 2 | 5 | 10 – MODÉRÉ | Vérins certifiés, cales mécaniques, PTW fosse, inspection | 1 | 4 | 4 – FAIBLE |\n| R03 | Toiture wagons (hauteur > 3 m) | Chute de hauteur | 3 | 5 | 15 – ÉLEVÉ | Harnais EN 361, ligne de vie inox, PTW hauteur, météo | 1 | 3 | 3 – FAIBLE |\n| R04 | Soudure / meulage | Projection, brûlure | 4 | 3 | 12 – ÉLEVÉ | Écran de protection, EPI thermiques, permis feu, périmètre | 2 | 2 | 4 – FAIBLE |\n| R05 | Travaux électriques HT | Électrocution, arc | 2 | 5 | 10 – MODÉRÉ | Consignation LOTO, habilitation HT, gants cl. 2, visière | 1 | 5 | 5 – MODÉRÉ |\n| R06 | Circulation ferrée active | Heurt par wagon | 3 | 5 | 15 – ÉLEVÉ | Fenêtre travaux CTG, sentinelles, autorisation voie, gilet HV | 1 | 5 | 5 – MODÉRÉ |\n| R07 | Espace confiné (soutes wagons) | Asphyxie / gaz toxique | 2 | 5 | 10 – MODÉRÉ | Détecteur 4 gaz, permis confiné, gardien, ventilation forcée, ARI | 1 | 5 | 5 – MODÉRÉ |\n| R08 | Levage / grutage | Chute de charge | 2 | 5 | 10 – MODÉRÉ | Élingues certifiées, zone d'exclusion, signaleur, PTW | 1 | 4 | 4 – FAIBLE |\n| R09 | Produits chimiques | Intoxication, brûlure | 3 | 3 | 9 – MODÉRÉ | FDS affichée, EPI chimiques, stockage ventilé, bac de rétention | 2 | 2 | 4 – FAIBLE |\n| R10 | Bruit / vibrations (> 85 dB) | Surdité professionnelle | 4 | 3 | 12 – ÉLEVÉ | Bouchons SNR ≥ 28 dB, rotation des postes, audiogramme annuel | 2 | 2 | 4 – FAIBLE |\n| R11 | Chaleur extrême (Guinée > 35 °C) | Coup de chaleur | 4 | 3 | 12 – ÉLEVÉ | Hydratation 3 L/j, rotations obligatoires, surveillance médicale | 2 | 2 | 4 – FAIBLE |\n| R12 | Manutention manuelle | TMS, lombalgie | 4 | 2 | 8 – MODÉRÉ | Formation gestes et postures, aides mécaniques, rotation | 2 | 2 | 4 – FAIBLE |\n| R13 | Gestion des huiles usées | Pollution sol / eau | 3 | 3 | 9 – MODÉRÉ | Bacs de rétention, fûts hermétiques, BSD | 1 | 2 | 2 – ACCEPTABLE |\n| R14 | Incendie atelier | Destruction / blessures | 3 | 4 | 12 – ÉLEVÉ | Extincteurs, détection fumée, exercice d'évacuation trimestriel | 1 | 3 | 3 – FAIBLE |\n\n\n## 3. PLAN D'ACTION PRIORISÉ\nPlan d'action prioritaire (risques résiduels « modérés »)\n\n| Risque | Action complémentaire | Responsable | Délai |\n| R05 Électrique HT | Formation de recyclage de l'habilitation HT semestrielle + vérification des EPI isolants à chaque PTW | Directeur HSE | Permanent |\n| R06 Circulation ferrée | Revue mensuelle de la procédure fenêtre travaux CTG + briefing avant chaque accès voie | Resp. HSE + CTG | Mensuel |\n| R07 Espace confiné | Simulation espace confiné semestrielle + vérification de la calibration des détecteurs à chaque entrée | Technicien HSE | Semestriel |\n\n## 4. POINT À VÉRIFIER\nPoint à vérifier : dans le registre, les scores de 12 sont libellés « élevé » alors que le barème les classe « modéré » ; les scores de 3 sont « faible » (barème : acceptable) et ceux de 5 sont « modéré » (barème : faible). L'application, pour ses propres calculs de risque, applique le barème.\n## 5. MISE À JOUR DU DOCUMENT\n- Mise à jour annuelle obligatoire (date cible : janvier de chaque année)\n- Après tout accident ou incident significatif (LTI ou supérieur)\n- Lors de toute modification des procédés, équipements ou de l'organisation\n- Après l'arrivée de nouveaux équipements ou produits chimiques\n- En cas de modification de la réglementation guinéenne ou des standards CTG", "LAG-SIM-HSE-ATC-001": "## 1. INTRODUCTION ET OBJECTIF\nL'Analyse des Tâches Critiques (ATC) identifie les activités à haut risque liées à la maintenance des wagons sur le corridor ferroviaire Simandou. Elle vise à définir des contrôles spécifiques pour chaque tâche critique afin de réduire les risques à un niveau ALARP (aussi bas que raisonnablement possible).\nL'ATC est le document de référence pour l'émission des permis de travail (PTW). Toute tâche référencée dans ce registre requiert obligatoirement un PTW avant démarrage, sans exception.\n## 2. MÉTHODOLOGIE\n| Étape | Méthode | Description |\n| 1 | Identification des tâches | Observation terrain, entretiens avec les opérateurs, analyse documentaire des modes opératoires existants |\n| 2 | Évaluation des risques | Matrice probabilité × gravité (5×5), risque brut et risque résiduel après mesures |\n| 3 | Barrières critiques de contrôle (BCC) | Mesures de prévention et de protection, hiérarchie des contrôles : élimination, puis EPC, puis EPI |\n| 4 | Vérification des BCC | Inspection terrain, test fonctionnel, audit : fréquence définie pour chaque barrière |\n| 5 | Révision et mise à jour | Annuelle, ou après tout incident significatif, modification organisationnelle ou changement de procédé |\n## 3. REGISTRE DES TÂCHES CRITIQUES\nToute tâche de ce registre exige un permis de travail avant démarrage, sans exception. Révision annuelle ou après tout incident significatif.\n\n| N° | Tâche | Danger | Conséquence | Barrières critiques de contrôle | Responsable | Vérification | Niveau |\n| TC-001 | Déplacement de wagons / couplage | Écrasement, coincement | Décès, amputation | • Isolation LOTO ferroviaire obligatoire avant tout accès ; • Zone de sécurité balisée à 3 m de chaque côté des voies ; • Signalisation sonore et visuelle de tout mouvement ; • PTW ferroviaire obligatoire | Chef de chantier + HSE | Inspection avant démarrage + PTW | CRITIQUE |\n| TC-002 | Travail sous wagon – fosses et vérins | Chute de charge, effondrement | Décès, blessure grave | • Vérins certifiés inspectés avant usage ; • Cales de sécurité mécaniques posées en complément ; • Garde-corps de fosse en place et verrouillé ; • PTW fosse obligatoire + contrôle atmosphérique | Technicien HSE | Inspection journalière des vérins | ÉLEVÉ |\n| TC-003 | Travaux électriques (caténaire / HT) | Électrocution, arc électrique | Décès | • Consignation HT complète – procédure LOTO ; • Habilitation électrique HT valide obligatoire ; • EPI isolants : gants cl. 2, visière anti-arc, tapis ; • Permis électrique HT cosigné CTG | Électricien qualifié HT | Test 0 V avant travaux + habilitation vérifiée | CRITIQUE |\n| TC-004 | Travaux en hauteur – toiture wagons | Chute de hauteur | Décès, blessure grave | • Harnais antichute 5 points certifié EN 361 obligatoire ; • Ligne de vie horizontale installée sur la toiture ; • Zone au sol balisée – exclusion des piétons ; • Permis hauteur + contrôle météo (vent < 50 km/h) | Chef d'équipe + HSE | Inspection des EPI avant travaux (7 points) | ÉLEVÉ |\n| TC-005 | Soudure / oxycoupage / meulage | Incendie, brûlures, fumées toxiques | Décès, blessure grave, maladie professionnelle | • Permis à feu émis et affiché ; • Extincteur polyvalent à 2 m du poste ; • EPI thermiques complets : masque, tablier, gants ; • Ventilation forcée en espace semi-fermé | Chef de chantier | Inspection du poste de soudure quotidienne | ÉLEVÉ |\n| TC-006 | Manipulation de produits chimiques | Intoxication, incendie, explosion | Blessure, décès, pollution | • FDS disponible et affichée ; • EPI chimiques : masque A2P3, gants nitrile, lunettes ; • Local ventilé – stockage en armoire dédiée ; • Bac de rétention obligatoire sous tout stockage | Magasinier / HSE | Vérification FDS et stockage mensuelle | MODÉRÉ |\n| TC-007 | Levage / élingage – ponts et grues | Chute de charge, écrasement | Décès, blessure grave | • Élingues et accessoires de levage certifiés et inspectés ; • Zone d'exclusion balisée sous charge pendant toute la levée ; • Signaleur qualifié désigné et équipé d'une radio ; • PTW levage + charge maximale affichée sur l'élingue | Grutier + HSE | Inspection des élingues avant utilisation (visuelle + registre) | CRITIQUE |\n| TC-008 | Circulation ferrée – exposition à la voie | Heurt par wagon ou locomotive | Décès | • Fenêtre de travaux définie et validée par CTG Opérations ; • Sentinelles positionnées aux deux extrémités de la zone ; • Port du gilet haute visibilité obligatoire sur toute voie ; • Autorisation d'accès voie cosignée Resp. voie + HSE | Responsable voie + HSE | Briefing obligatoire avant chaque intervention | CRITIQUE |\n| TC-009 | Travail en espace confiné – soutes wagons | Asphyxie, intoxication par gaz | Décès | • Mesure atmosphérique (O₂, CO, H₂S, LEL) avant entrée ; • Permis espace confiné émis et affiché ; • Gardien désigné et présent en permanence à l'extérieur ; • Ventilation mécanique forcée – ARI disponible | Technicien HSE | Test de l'atmosphère avant entrée + toutes les 30 min | CRITIQUE |\n| TC-010 | Bruit / vibrations – meulage, sablage | Surdité professionnelle irréversible | Invalidité professionnelle | • Bouchons moulés SNR ≥ 28 dB ou casque antibruit SNR ≥ 30 dB ; • Rotation des postes bruyants (4 h consécutives maximum) ; • Audiogramme annuel obligatoire – résultat archivé ; • Mesure sonométrique mensuelle des postes | Chef d'équipe + médecin | Audiogramme annuel + vérification des EPI mensuelle | MODÉRÉ |\n\n\n## 4. TYPES DE PERMIS DE TRAVAIL ASSOCIÉS\nTypes de permis de travail\n\n| Permis | Travaux concernés | Tâches critiques | Cosignataires requis |\n| Général | Toutes activités de maintenance courante | TC-002, TC-006, TC-010 | Superviseur + HSE |\n| Travail à chaud | Soudure, oxycoupage, meulage à étincelles | TC-005 | Chef de chantier + HSE + extincteur |\n| Travail en hauteur | Tout travail > 1,80 m – toiture wagons | TC-004 | Chef d'équipe + HSE + météo |\n| Espace confiné | Entrée soutes wagons / fosses profondes | TC-009 | HSE + gardien désigné + mesure de gaz |\n| Électrique HT/BT | Consignations et travaux électriques | TC-003 | Électricien habilité + CTG |\n| Ferroviaire | Travaux sur voie active / déplacement de wagons | TC-001, TC-008 | Resp. voie + HSE + CTG Opérations |\n| Levage | Grutage, élingage, levée de charges lourdes | TC-007 | Grutier habilité + HSE + signaleur |\n\nPoint à vérifier : le formulaire de permis (FIC-002) ne propose pas de case pour les permis ferroviaire et levage, alors que l'ATC les exige. L'application les propose.\n## 5. RÉVISION DU DOCUMENT\n- Revu annuellement ou à la suite de tout incident significatif, modification organisationnelle ou changement de procédé\n- Toute révision est validée par le Directeur HSE de Laguipres SAU et approuvée par CTG", "LAG-SIM-HSE-PROC-001": "## PROC-001 – Permis de travail (PTW)\n- Objet : émission, validation, suivi et clôture des permis pour toutes les tâches à risque ; le PTW garantit l'analyse préalable des risques et les mesures de prévention avant tout démarrage.\n- Étapes : 1) le superviseur identifie la tâche critique et rédige la JSA (FIC-004) ; 2) il remplit le PTW (FIC-002) ; 3) le technicien HSE valide la complétude ; 4) le chef de chantier approuve et contresigne ; 5) briefing de l'équipe devant le poste, chaque agent signe ; 6) le PTW est affiché sur le poste pendant les travaux ; 7) renouvellement si interruption de plus de 30 min ou changement d'équipe ; 8) clôture cosignée superviseur + HSE avec vérification de la restitution de l'outillage.\n- Règle cardinale : aucun travail critique sans PTW signé et affiché.\n- Un PTW est valable un poste de travail au maximum. En cas d'accident ou d'événement grave, travaux suspendus et PTW clôturé. Archivage 5 ans minimum.", "LAG-SIM-HSE-PROC-002": "## PROC-002 – Consignation / déconsignation (LOTO)\n- Règle cardinale : toute violation entraîne une mesure disciplinaire immédiate.\n- Consignation en 7 étapes : notifier · identifier les sources d'énergie · isoler · cadenasser (cadenas personnel, par l'intervenant seul) · étiqueter « DANGER – DO NOT OPERATE » · purger l'énergie résiduelle · vérifier (essai de démarrage et tension 0 V au voltmètre).\n- Déconsignation : retirer les outils et dégager la zone ; chaque intervenant retire seulement son cadenas ; vérifier que tout le personnel est en zone sécurisée ; notifier la fin des travaux ; remise en service progressive.\n- Un intervenant = un cadenas personnel. Perte d'un cadenas : procédure d'urgence avec le Directeur HSE et le chef de chantier.", "LAG-SIM-HSE-PROC-003": "## PROC-003 – Travail en hauteur (> 1,80 m)\n- Prérequis : PTW hauteur signé · harnais vérifié (7 points) · point d'ancrage certifié ≥ 15 kN et étiqueté · longe à absorption d'énergie (< 2 m) · zone au sol balisée · formation à jour (recyclage annuel) · météo : vent < 50 km/h, pas d'orage ni de pluie battante.\n- Interdictions (faute grave) : jamais sans harnais homologué et ancrage certifié ; jamais seul (binôme obligatoire) ; interdit par vent > 50 km/h, orage, pluie battante ou visibilité réduite ; interdit sur une toiture de wagon sans ligne de vie ; interdit de jeter ou passer des objets par-dessus un bord.\n- Chute : déclencher l'alarme, contacter le HSE et l'infirmier ; ne pas retirer la victime sans évaluation médicale ; baliser ; déclarer l'incident (FIC-006) dans l'heure.", "LAG-SIM-HSE-PROC-004": "## PROC-004 – Gestion des incidents\n- Classification : niveau 5 fatalité · 4 LTI (accident avec arrêt) · 3 MTO (traitement médical) · 2 FAC (premiers secours) · 1 presqu'accident · 0 situation dangereuse.\n- Réponse : T+0 secours et sécurisation ; T+15 min alerte de la hiérarchie et du HSE, isolement de la zone ; T+1 h déclaration FIC-006 au Directeur HSE ; T+24 h rapport préliminaire (Direction HSE et CTG HSE) ; T+72 h enquête complète ; T+30 j vérification de l'efficacité des actions.\n- Notification : N5 immédiat (DG + CTG + autorités guinéennes) · N4 < 1 h (Dir. HSE + DG + CTG HSE) · N3 < 4 h (Dir. HSE + chef de projet) · N2 < 24 h (Resp. HSE site + chef d'équipe) · N1 < 48 h (Resp. HSE site).\n- Investigation par la méthode des 5 pourquoi pour tout incident de niveau 2 et plus.", "LAG-SIM-HSE-PROC-005": "## PROC-005 – Urgence et évacuation\n- Alarme : 3 sonneries longues continues = évacuation générale immédiate ; message radio « CODE ROUGE – ÉVACUATION ZONE [X] – REJOIGNEZ LE POINT [P1/P2] ». La fin d'urgence est annoncée par le Directeur de l'Urgence uniquement.\n- Rôles : Directeur de l'Urgence (chef de chantier ou suppléant) · agents d'évacuation (techniciens HSE, chefs d'équipe) · secouristes SST (2 minimum par zone) · responsable communication · gardien de zone.\n- Évacuation : arrêt des travaux, sortie la plus sûre, rassemblement au point PR1 ou PR2, appel nominal par les chefs d'équipe, personne ne retourne sans autorisation, ne pas déplacer une victime traumatisée.\n- Scénarios : incendie / explosion (pompiers 18 / 112) · accident grave · déversement chimique majeur · incident ferroviaire (CTG Opérations) · intempérie. Exercices : 2 fois par an au minimum (T1 et T3).", "LAG-SIM-HSE-PROC-006": "## PROC-006 – Gestion des déchets\n- Tri : dangereux (DIS) en fût hermétique rouge, prestataire agréé · métaux et ferraille en benne jaune, recyclage · recyclable propre en conteneur vert · non dangereux en poubelle grise, décharge communale.\n- Règles : huiles usées en fûts hermétiques étiquetés, jamais dans le sol ni les caniveaux ; chiffons souillés = DIS ; bordereau de suivi (BSD) pour tout transfert de DIS ; bacs de rétention sous tout équipement à fluides ; aucun brûlage à l'air libre ; stockage des DIS sécurisé, couvert et ventilé.\n- Un déversement de DIS dans le sol ou l'eau est une infraction grave : notification immédiate. Registre des déchets mensuel, audit trimestriel, prestataires agréés par les autorités guinéennes.", "LAG-SIM-HSE-PROC-007": "## PROC-007 – Travail en espace confiné\n- Règle cardinale : aucune entrée sans permis signé et mesure atmosphérique validée.\n- Prérequis : permis espace confiné · mesure avant entrée et toutes les 30 min · détecteur 4 gaz étalonné (< 6 mois) · gardien présent à l'extérieur en permanence · équipements de secours prêts (treuil d'extraction, harnais, extincteur) · ventilation mécanique forcée · formation à jour.\n- Seuils (normal / alarme 1 / alarme 2 = évacuation) : O₂ 19,5-23 % / hors de 19,5-23 % / < 18 % ou > 24 % · CO < 25 ppm / 25-50 / > 50 · H₂S < 10 ppm / 10-15 / > 15 · gaz inflammables < 10 % LIE / 10-20 / > 20 %.\n- Interdictions : entrer sans permis et mesure ; tenter un sauvetage sans protection respiratoire (risque de double victime) ; utiliser de l'oxygène pur pour aérer ; laisser l'espace sans surveillance si quelqu'un est à l'intérieur.", "LAG-SIM-HSE-PLAN-001": "## 1. PRÉSENTATION DU PROJET\n| Élément | Détail |\n| Projet | Maintenance des wagons – corridor ferroviaire Simandou |\n| Maître d'ouvrage | Simfer S.A. / WCS |\n| Client direct | CTG – Compagnie de Transport de Guinée |\n| Prestataire HSE | Laguipres Simandou SARLU, filiale de Laguipres SAU |\n| Durée du projet | Janvier 2026 – Décembre 2026 (12 mois, année 2) |\n| Sites couverts | Ateliers de maintenance Simandou (zones Nord et Sud) |\n| Effectif prévu | Environ 53 agents (maintenance, HSE, logistique) |\n| Heures travaillées estimées | Environ 120 000 heures par an |\n## 2. ORGANISATION HSE DU PROJET\n| Poste | Nombre | Qualification requise | Missions principales |\n| Directeur HSE projet | 1 | Ingénieur HSE, 10 ans d'expérience, NEBOSH ou équivalent | Pilotage global du système, reporting CTG, audits |\n| Responsable HSE site | 2 | Technicien supérieur HSE, 5 ans d'expérience | Supervision terrain, inspection hebdomadaire, PTW |\n| Technicien HSE | 3 | BTS HSE, 3 ans d'expérience | Inspections quotidiennes, causeries, inductions |\n| Infirmier de chantier | 1 | Diplôme d'infirmier, secours d'urgence | Santé des travailleurs, premiers secours, visites médicales |\n| Secouriste SST | 6 | Certificat SST à jour (recyclage annuel) | Premiers secours par zone de travail |\n## 3. EXIGENCES EPI DU PROJET\n| Catégorie | EPI requis | Zone / activité |\n| EPI communs (tout le personnel) | Casque EN 397, chaussures S3, lunettes EN 166, gilet haute visibilité, gants EN 388 | Accès obligatoire à tout le site |\n| Soudure / oxycoupage | Masque de soudeur auto-assombrissant, tablier cuir, gants thermiques EN 407 | Zone C – atelier soudure |\n| Travail en hauteur | Harnais 5 points EN 361, longe à absorption d'énergie EN 355 | Zones A et E – toiture des wagons |\n| Produits chimiques | Masque A2P3 demi-face, gants nitrile, lunettes anti-projections | Zone D – stockage chimie |\n| Exposition au bruit | Bouchons moulés SNR ≥ 28 dB ou casque antibruit SNR ≥ 30 dB | Zone C – meulage, sablage |\n| Électricité HT/BT | Gants isolants classe 2, visière anti-arc, tapis isolant | Postes électriques HT |\n| Espace confiné | Détecteur 4 gaz, harnais d'extraction, ARI pour le secours | Zone B – fosses et soutes |\n## 4. PROCÉDURES D'URGENCE\nContacts : infirmerie de chantier 24 h/24 (canal radio HSE) · SAMU / urgences · sapeurs-pompiers · responsable HSE Laguipres Simandou joignable H24 (radio et mobile) · CTG Opérations, ligne ferrée 24 h/24 · hôpital de référence Simandou · ambassade ou consulat pour les expatriés. Les numéros sont à compléter.\n- Alerter : 3 sonneries longues = évacuation immédiate, plus message radio sur le canal HSE\n- Évaluer : identifier la nature et la localisation de l'urgence (incendie, blessure, déversement…)\n- Évacuer : rejoindre les points de rassemblement P1 (zone Nord) ou P2 (zone Sud)\n- Compter : vérification nominale des présences par chaque chef d'équipe\n- Notifier : alerter le HSE Laguipres Simandou, CTG et les secours extérieurs selon la gravité\n- Analyser : rapport d'événement rédigé dans les 24 heures par le HSE site\n## 5. INDICATEURS DE PERFORMANCE HSE (KPI)\n| Indicateur | Formule de calcul | Objectif 2026 | Fréquence | Seuil d'alerte |\n| Taux de fréquence (TF1) | LTI × 1 000 000 / heures travaillées | 0,00 | Mensuel | TF1 > 0 |\n| Taux de gravité (TG) | Jours perdus × 1 000 / heures travaillées | 0,00 | Mensuel | TG > 0 |\n| TRIR | Incidents enregistrables × 200 000 / heures travaillées | < 2,0 | Mensuel | TRIR > 2 |\n| Taux de formations réalisées | Formés / effectif × 100 | 100 % | Mensuel | < 95 % |\n| Causeries HSE | Causeries réalisées par équipe et par mois | ≥ 4 par mois | Mensuel | < 4 |\n| Audits et inspections terrain | Nombre réalisés par mois | ≥ 8 par mois | Mensuel | < 8 |\n| Conformité EPI (inspections) | Observations conformes / total × 100 | ≥ 95 % | Mensuel | < 90 % |\n| Taux de PTW clôturés | PTW clôturés correctement / total | 100 % | Mensuel | < 100 % |\n| Presqu'accidents signalés | Nombre de presqu'accidents déclarés | ≥ 2 par mois | Mensuel | 0 signalement |\n| Actions correctives closes | Actions clôturées dans le délai / total | ≥ 90 % | Trimestriel | < 80 % |\n## 6. GESTION DES INCIDENTS\n| Niveau | Type d'événement | Délai de notification | Actions et destinataires |\n| 5 | Fatalité | Immédiat | Chef de projet, DG Laguipres, CTG, autorités guinéennes ; suspension totale de l'activité |\n| 4 | LTI (accident avec arrêt) | < 1 heure | Chef de projet, Dir. HSE, DG, CTG HSE ; enquête dans les 24 h |\n| 3 | MTO (traitement médical) | < 4 heures | Dir. HSE, chef de projet ; rapport préliminaire sous 24 h |\n| 2 | FAC (premiers secours) | < 24 heures | Resp. HSE site, chef d'équipe ; fiche FIC-006 dans les 24 h |\n| 1 | Presqu'accident | < 48 heures | Resp. HSE site ; enregistrement et analyse |\n| 0 | Situation dangereuse | < 72 heures | Tech. HSE ; traitement et clôture de l'action corrective |\n## 7. AUDITS ET INSPECTIONS HSE\n| Type | Responsable | Fréquence | Contenu / documents produits |\n| Inspection terrain journalière | Technicien HSE | Quotidien | Fiche FIC-001 : EPI, PTW, ordre et propreté, balisage |\n| Inspection formelle hebdomadaire | Responsable HSE site | Hebdomadaire | Rapport d'inspection, liste d'écarts, délais de correction |\n| Audit interne HSE mensuel | Directeur HSE projet | Mensuel | Rapport d'audit : conformité aux procédures et KPI |\n| Audit EPI / équipements | Responsable HSE site | Bimestriel | Registre EPI : état, péremption, conformité du port |\n| Audit croisé Direction Laguipres | Responsable HSE site | Trimestriel | Rapport d'audit croisé : benchmark et recommandations |\n| Audit client CTG | Équipe HSE CTG | Semestriel | Rapport client et actions correctives validées par CTG |\n| Vérification des extincteurs | Magasinier / HSE | Mensuel | Registre : charge, scellé, accessibilité |\n| Contrôle des lignes de vie et harnais | Technicien HSE | Mensuel | Registre EPI hauteur : 7 points et date de péremption |", "LAG-SIM-HSE-EPI-001": "## 1. OBJET ET CHAMP D'APPLICATION\nListe des équipements de protection individuelle (EPI) et collective (EPC) obligatoires sur le site de maintenance des wagons Simandou. Le port des EPI est obligatoire et non négociable. Toute non-conformité donne lieu à un arrêt de travail immédiat. Tolérance zéro : tout travailleur sans EPI complets est exclu de la zone de travail.\n## 2. EPI OBLIGATOIRES – ACCÈS AU CHANTIER (5)\n| EPI | Rôle de protection | Norme | Spécification |\n| Casque de sécurité | Protection du crâne contre chutes d'objets et heurts | EN 397 | Classe E (électrique) |\n| Chaussures de sécurité S3 | Embout acier, semelle anti-perforation | EN ISO 20345 | S3, antistatique, imperméable |\n| Lunettes de protection | Projections, poussières | EN 166 | Polycarbonate, coques latérales |\n| Gilet haute visibilité | Visibilité en zone de circulation | EN ISO 20471 | Classe 2 minimum, bandes rétroréfléchissantes |\n| Gants de travail polyvalents | Coupures et abrasions | EN 388 | Niveau 4131 ou supérieur |\n## 3. EPI SPÉCIFIQUES PAR ACTIVITÉ\n| Activité | Équipement | Norme | Spécification |\n| Soudure, oxycoupage, meulage | Masque de soudeur auto-assombrissant | EN 175 / EN 169 | Classe DIN 9 à 13 |\n| Soudure, oxycoupage, meulage | Tablier cuir de soudeur | EN ISO 11611 | Classe A1/A2 |\n| Soudure, oxycoupage, meulage | Gants thermiques | EN 407 / EN 12477 | Niveau thermique ≥ 3 |\n| Soudure, oxycoupage, meulage | Jambières / guêtres cuir | EN ISO 11611 | Projections de métal fondu |\n| Travail en hauteur (> 1,80 m) | Harnais antichute 5 points | EN 361 | Attachement dorsal et sternal |\n| Travail en hauteur (> 1,80 m) | Longe à absorption d'énergie | EN 355 | Longueur ≤ 2 m, déclenchement < 6 kN |\n| Travail en hauteur (> 1,80 m) | Casque avec jugulaire | EN 397 | Jugulaire réglable obligatoire |\n| Travail en hauteur (> 1,80 m) | Ligne de vie / câble d'assurance | EN 795 type C | Charge ≥ 15 kN par point, préinstallée sur la toiture |\n| Produits chimiques | Masque respiratoire FFP3 | EN 149 | Efficacité ≥ 99 % |\n| Produits chimiques | Demi-masque et filtre combiné | EN 140 + EN 14387 | Filtre A2P3 |\n| Produits chimiques | Gants nitrile longue manchette | EN 374 | Épaisseur ≥ 0,4 mm, longueur ≥ 32 cm |\n| Produits chimiques | Lunettes-masque étanches | EN 166 | Type B, protection totale |\n| Produits chimiques | Tablier de protection chimique | EN 13034 | PVC ou polyéthylène renforcé |\n| Bruit (> 85 dB) | Bouchons d'oreilles moulés | EN 352-2 | SNR ≥ 28 dB |\n| Bruit (> 85 dB) | Casque antibruit | EN 352-1 | SNR ≥ 30 dB, atelier > 95 dB |\n| Travaux électriques HT/BT | Gants isolants | EN 60903 | Classe 2 (1000 V) ou classe 4 (36 kV) |\n| Travaux électriques HT/BT | Tapis isolant | EN 61111 | Classe 2 – 17 kV |\n| Travaux électriques HT/BT | Perches isolantes | EN 60900 | Classe 2 minimum |\n| Travaux électriques HT/BT | Visière anti-arc | EN 166 / IEC 61482 | Classe 1 ou 2 |\n| Espace confiné | Détecteur 4 gaz portatif | EN 60079 | Calibration < 6 mois |\n| Espace confiné | Appareil respiratoire isolant (ARI) | EN 137 | 30 min d'autonomie minimum |\n| Espace confiné | Harnais et treuil d'extraction | EN 361 + EN 1496 | Treuil ≥ 150 kg SWL |\n| Intervention incendie | Équipement de protection pompier | EN 469 | Veste et pantalon |\n## 4. ÉQUIPEMENTS DE PROTECTION COLLECTIVE (EPC)\n| Catégorie | Équipement | Norme | Spécification |\n| Balisage et signalisation | Barrières Nadar / grilles amovibles | — | Hauteur ≥ 1 m, orange fluorescent |\n| Balisage et signalisation | Rubalise rouge et blanc | — | Largeur ≥ 7 cm, balisage à 1 m de la zone |\n| Balisage et signalisation | Cônes de signalisation | NF P 98-520 | Hauteur ≥ 50 cm, bandes rétroréfléchissantes |\n| Balisage et signalisation | Panneaux de signalisation HSE | ISO 7010 | Danger, interdiction, obligation |\n| Protection contre les chutes | Garde-corps fixe | EN 13374 | H ≥ 1 m, lisse intermédiaire et plinthe |\n| Protection contre les chutes | Ligne de vie horizontale | EN 795 type C | Charge ≥ 15 kN par point |\n| Protection contre les chutes | Filets de sécurité antichute | EN 1263-1 | Maillage ≤ 10 cm, testé 6 kJ |\n| Protection contre les chutes | Plinthe anti-chute d'objets | EN 13374 | Hauteur ≥ 15 cm |\n| Prévention et lutte incendie | Extincteur CO₂ 5 kg | EN 3 | Vérification mensuelle, révision annuelle |\n| Prévention et lutte incendie | Extincteur à poudre ABC 6 kg | EN 3 | Vérification mensuelle, révision annuelle |\n| Prévention et lutte incendie | Couverture anti-feu | EN 1869 | 60 × 80 cm minimum |\n| Prévention et lutte incendie | Détecteur de fumée / chaleur | EN 54 | Vérification trimestrielle |\n| Gaz et produits chimiques | Bac de rétention | — | Capacité ≥ 110 % du plus grand contenant |\n| Gaz et produits chimiques | Kit anti-déversement | — | Capacité ≥ 50 L |\n| Gaz et produits chimiques | Ventilation mécanique forcée | — | Débit ≥ 20 volumes par heure |\n| Gaz et produits chimiques | Armoire de stockage chimique | EN 14727 | Ventilation basse et haute |\n| Bruit et vibrations | Écran acoustique mobile | — | Atténuation ≥ 15 dB |\n| Bruit et vibrations | Enceinte de confinement du bruit | — | Réduction ≥ 20 dB |\n| Gestion de la circulation | Barrière antifranchissement piétons | — | Hauteur ≥ 1 m, structure rigide |\n| Gestion de la circulation | Miroirs de surveillance de recul | — | Diamètre ≥ 60 cm, à 2,50 m |\n| Gestion de la circulation | Plots et délinéateurs | — | Espacement ≤ 5 m, rétroréfléchissants |\n## 5. RÈGLES D'UTILISATION ET D'ENTRETIEN DES EPI\n- Chaque EPI est vérifié avant chaque utilisation selon sa liste de contrôle spécifique (7 points pour le harnais, 3 points pour les gants isolants…)\n- Un EPI défectueux, fissuré, brûlé ou périmé est retiré du service immédiatement et remplacé\n- Les EPI ne sont pas partagés entre travailleurs, sauf s'ils sont désinfectés entre chaque usage\n- Tout EPI ayant subi un choc important (casque après impact, harnais après chute) est mis au rebut, même sans dommage visible\n- Le nettoyage quotidien est assuré par le porteur ; l'entretien périodique (gants isolants, ARI) par le magasinier HSE\n- Les harnais sont stockés à l'abri des UV, de l'humidité et des produits chimiques\n- Le registre de distribution des EPI est tenu à jour par le magasinier et contrôlé mensuellement par le HSE\n## 6. RESPONSABILITÉS\n| Responsable | Obligations EPI / EPC | Fréquence |\n| Direction HSE | Définir les EPI et EPC obligatoires, auditer la conformité, valider le renouvellement | Trimestriel |\n| Responsable HSE site | Contrôler le port des EPI lors des inspections, signaler les non-conformités | Quotidien |\n| Technicien HSE | Vérifier les EPI à la prise de poste, former les travailleurs à leur utilisation | À chaque poste |\n| Chef de chantier / superviseur | Refuser l'accès à tout travailleur sans EPI complets et conformes | Avant chaque tâche |\n| Magasinier | Gérer le stock d'EPI, assurer la disponibilité, tenir le registre de distribution | Continu |\n| Chaque travailleur | Porter ses EPI, les entretenir, signaler tout défaut à son superviseur | Continu |", "LAG-SIM-HSE-SENS-001": "## 1. OBJECTIFS DU PROGRAMME\n- Maintenir et renforcer la culture HSE sur l'ensemble du site (taux de participation ≥ 95 %)\n- Assurer que chaque travailleur connaît les risques de son poste et les mesures de prévention associées\n- Réduire le nombre de comportements non conformes observés lors des inspections terrain\n- Augmenter le nombre de presqu'accidents signalés (objectif : ≥ 2 signalements par mois)\n- Valoriser les bonnes pratiques et les comportements sécurité exemplaires\n## 2. CALENDRIER DES THÈMES DE SENSIBILISATION\n| Mois | Thème | Cible | Animateur | Durée |\n| Janvier | Lancement et culture HSE (politique, 10 règles cardinales, vision zéro) | Tout le personnel | Dir. HSE | 30 min |\n| Février | Risques mécaniques et LOT mémo, quiz de 5 questions | Technicien HSE |\n## 4. MESURE D'EFFICACITÉ\n| Indicateur | Méthode de mesure | Objectif | Fréquence |\n| Taux de participation aux causeries | Feuille de présence FIC-003 / effectif total × 100 | ≥ 95 % | Mensuel |\n| Score moyen du quiz de validation | Moyenne des scores après causerie | ≥ 80 % | Mensuel |\n| Presqu'accidents signalés | Comptage des déclarations (FIC-006) | ≥ 2 par mois | Mensuel |\n| Comportements conformes (observations) | Observations comportementales terrain / total | ≥ 90 % | Mensuel |\n| Perception HSE des travailleurs | Enquête anonyme de 10 questions | Score ≥ 8/10 | Semestriel |\n| Réduction des incidents (TF1) | Rapport mensuel HSE, tendance | TF1 = 0 | Mensuel |"};

/* ===== PAGE SYNCHRONISATION : code d'activation, diagnostic, synchronisation forcée ===== */
var APP_BUILD="4 novembre 2026 · enrôlement complet, coffre, diagnostic",syncDiag="";
function vSyncPage(){return'<div class="card"><b>Synchronisation</b><p>État : <b>'+esc(ghStatus())+'</b></p><div class="m">Version de l\'application : '+esc(APP_BUILD)+'<br>Dépôt : '+esc(GH.repo||"non configuré")+' · clé : '+(GH.token?"enregistrée":"absente")+' · en attente d\'envoi : '+Q.length+'</div><p><button onclick="syncNow()">Synchroniser maintenant</button> <button class="g" onclick="syncRun()">Lancer le diagnostic</button></p></div>'
+(syncDiag?'<div class="card"><b>Résultat du diagnostic</b>'+syncDiag+'</div>':'')
+'<div class="card"><b>Activer avec un code</b><div class="m">Collez ici le code d\'activation (il commence par LAG1.). Les espaces et les retours à la ligne sont ignorés.</div><textarea id="sy-code" rows="3" placeholder="LAG1.…"></textarea><p><button onclick="syncActivate()">Activer ce code</button></p></div>'
+'<div class="card"><button class="g s" onclick="syncReset()">Effacer la configuration de cet appareil</button><div class="m">À utiliser si l\'appareil garde un ancien code. Les dossiers déjà saisis restent sur l\'appareil.</div></div>'}
function syncNow(){toast("Synchronisation en cours…");Promise.resolve(syncAll()).then(function(){status();render();toast(ghStatus())})}
function syncActivate(){var c=v("sy-code").replace(/\s+/g,"");if(!c){toast("Collez d'abord le code.");return}activateCode(c);syncDiag="";render()}
function syncReset(){if(!confirm("Effacer le code de synchronisation de cet appareil ? Les dossiers déjà saisis restent sur l'appareil."))return;GH={};try{localStorage.removeItem("lag-gh")}catch(e){}ghErr=0;status();render();toast("Configuration effacée : collez un nouveau code.")}
async function syncRun(){syncDiag='<div class="m">Diagnostic en cours…</div>';render();var L=[],ok=function(t){L.push("<div>✔ "+t+"</div>")},ko=function(t,a){L.push('<div class="red">✘ '+t+"</div>"+(a?'<div class="m" style="margin:0 0 8px 18px">→ '+a+"</div>":""))},wn=function(t,a){L.push("<div>⚠ "+t+"</div>"+(a?'<div class="m" style="margin:0 0 8px 18px">→ '+a+"</div>":""))};
try{
if(navigator.onLine===false)ko("L'appareil n'est pas connecté à Internet.","Activez les données mobiles ou le Wi-Fi, puis relancez le diagnostic.");else ok("Connexion Internet : oui.");
if(!GH.repo||!GH.token)ko("Aucun code d'activation sur cet appareil.","Collez le code (qui commence par LAG1.) dans la case « Activer avec un code ».");
else{ok("Code d'activation présent (dépôt « "+esc(GH.repo)+" »).");var r=null;
try{r=await fetch(ghApi(""),{headers:ghH()})}catch(e){ko("Impossible de joindre GitHub.","Vérifiez la connexion : certains réseaux bloquent api.github.com. Essayez avec les données mobiles.")}
if(r){if(r.status===401)ko("GitHub refuse la clé (erreur 401).","La clé a été supprimée, a expiré ou a été mal copiée. Refaites une clé et un nouveau code, puis collez-le ici.");
else if(r.status===403)ko("GitHub reconnaît la clé mais refuse l'accès (erreur 403).","Droits insuffisants ou limite de requêtes atteinte : attendez quelques minutes ; sinon refaites la clé avec « Contents : Read and write ».");
else if(r.status===404)ko("Le dépôt « "+esc(GH.repo)+" » est introuvable avec cette clé (erreur 404).","Vérifiez le nom (compte/sst-donnees) et que la clé a bien accès à ce dépôt.");
else if(!r.ok)ko("Réponse inattendue de GitHub (erreur "+r.status+").","Réessayez dans un moment.");
else{ok("La clé est acceptée et le dépôt est accessible.");var j=await r.json();if(j.permissions&&j.permissions.push===false)ko("La clé peut lire mais pas écrire.","Refaites la clé avec « Contents : Read and write ».");else ok("Droit d'écriture : oui.");
var r2=null;try{r2=await fetch(ghApi("/contents/cases"),{headers:ghH()})}catch(e){}
if(r2&&r2.ok){var a=await r2.json();ok("Dossiers sur GitHub : "+(Array.isArray(a)?a.length:0)+" dossier(s) lu(s).")}else if(r2&&r2.status===404)wn("Aucun dossier sur GitHub pour l'instant.","C'est normal si rien n'a encore été envoyé.");else wn("Lecture des dossiers impossible"+(r2?" (erreur "+r2.status+")":"")+".","Relancez le diagnostic dans un moment.")}}}
if(Q.length)wn(Q.length+" élément(s) en attente d'envoi.","Ils partent dès que la connexion et la clé fonctionnent : touchez « Synchroniser maintenant ».");else ok("Rien en attente d'envoi.");
var n=0;try{Object.keys(localStorage).forEach(function(k){if(k.indexOf("lag-")===0)n+=String(localStorage.getItem(k)||"").length})}catch(e){}
if(n>3500000)wn("Mémoire de l'appareil presque pleine ("+(n/1e6).toFixed(1)+" Mo sur environ 5).","Envoyez les dossiers puis archivez les plus anciens, sinon les nouveaux enregistrements pourraient être refusés.");else ok("Mémoire de l'appareil : "+(n/1e6).toFixed(1)+" Mo utilisés, de la place reste.");
ok("Version de l'application : "+esc(APP_BUILD)+".");
}catch(e){ko("Le diagnostic a rencontré une erreur : "+esc(String(e&&e.message||e)))}
syncDiag=L.join("");render()}

function saveTxt(){edit(sel,function(c){c.faits=v("d-faits");c.ana=v("d-ana");c.jp=parseInt(v("d-jp"))||0}).then(function(ok){if(ok)toast("Enregistré.")})}

if(s>=2&&!(document.getElementById("d-faits").value.trim()||c.faits.trim())){toast("Renseignez d'abord les faits confirmés.");return render()}
if(s>=4&&(c.acts||[]).some(function(a){return!a.done})){toast("Des actions restent ouvertes.");return render()}
edit(sel,function(x){x.faits=document.getElementById("d-faits").value;x.ana=document.getElementById("d-ana").value;x.state=s;x.hist.push(today()+" "+STATES[s])})}

a.href=URL.createObjectURL(b);a.download="dossiers-sst-"+today()+".json";a.click()}
function mkFile(c){return new File([JSON.stringify(c)],c.t.replace(/[:.]/g,"-")+"_"+slug(c.by||me)+"_"+c.key+".json",{type:"application/json"})}
async function sendFiles(fs){if(!fs.length){toast("Aucun dossier à envoyer.");return}
try{if(navigator.canShare&&navigator.canShare({files:fs})){await navigator.share({files:fs,title:"Dossiers SST Laguipres",text:fs.length+" dossier(s) SST"});return}}catch(e){if(e&&e.name==="AbortError")return}
fs.forEach(function(f){var a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click()});toast("Fichier(s) enregistré(s) dans Téléchargements.")}
function sendCase(k){sendFiles([mkFile(cases[k])])}
function sendAll(){sendFiles(all().map(mkFile))}
var CF=window.LAG_CFG||{},GH={},Q=[],busy=false,ghErr=0,GC={seen:{},cases:{}},pulling=false;
try{GH=JSON.parse(localStorage.getItem("lag-gh")||"{}");Q=JSON.parse(localStorage.getItem("lag-q")||"[]");GC=JSON.parse(localStorage.getItem("lag-gh-cache")||"null")||GC}catch(e){}
try{var hh=location.hash;if(hh.indexOf("#cfg=")===0){var hv=hh.slice(5);if(hv.indexOf("LAG1.")===0)CF={code:hv};else{var oo=JSON.parse(unb64(hv));CF={name:oo.name||"",repo:oo.repo||"",token:oo.token||""}}try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}}catch(e){}
function fromCode(c){try{var o=JSON.parse(unb64(String(c).trim().replace(/^LAG1\./,"")));return o&&o.repo&&o.token?o:null}catch(e){return null}}
if(CF.code){var oc=fromCode(CF.code);if(oc){CF.repo=oc.repo;CF.token=oc.token;CF.role=oc.role;CF.site=oc.site;CF.sect=oc.sect;CF.zone=oc.zone}}
if(CF.repo&&(!GH.repo||(CF.token&&GH.token!==CF.token))){GH={repo:CF.repo,token:CF.token||GH.token||""};try{localStorage.setItem("lag-gh",JSON.stringify(GH))}catch(e){}}
if(CF.name&&!me){me=CF.name;try{localStorage.setItem("lag-me",me)}catch(e){}}
try{var pp=JSON.parse(localStorage.getItem("lag-prof")||"null");if(pp&&PROFILES[pp.role])PROF=pp;else if(CF.role&&PROFILES[CF.role]){PROF={role:CF.role,site:CF.site||"",sect:CF.sect||0,zone:CF.zone||0};localStorage.setItem("lag-prof",JSON.stringify(PROF))}}catch(e){}
tab=(PROFILES[PROF.role].tabs[0])||"list";
function ghStatus(){return!GH.repo?"sync GitHub non configurée":ghErr?"erreur GitHub ("+ghErr+")":Q.length?Q.length+" en attente d'envoi":"synchronisé"}
function ghH(){return{Authorization:"Bearer "+GH.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}}
function ghApi(p){return"https://api.github.com/repos/"+GH.repo+p}
function ghOk(){return GH.repo&&GH.token&&navigator.onLine!==false}
function persistQ(){try{localStorage.setItem("lag-q",JSON.stringify(Q))}catch(e){}}
function persistGC(){try{localStorage.setItem("lag-gh-cache",JSON.stringify(GC))}catch(e){}}
function b64(t){return btoa(unescape(encodeURIComponent(t)))}
function unb64(t){return decodeURIComponent(escape(atob(t.replace(/\s/g,""))))}
function applyRemote(){Object.keys(GC.cases).forEach(function(k){var r=GC.cases[k];if(!cases[k]||(r.t||"")>(cases[k].t||""))cases[k]=r})}
function enqueue(c){Q=Q.filter(function(x){return x.key!==c.key});Q.push(JSON.parse(JSON.stringify(c)));persistQ();status();flush()}
async function flush(){if(busy||!ghOk()||!Q.length)return;busy=true;
try{while(Q.length){var c=Q[0],p="cases/"+c.key+"/"+c.t.replace(/[:.]/g,"-")+"_"+slug(c.by||me)+".json";
var r=await fetch(ghApi("/contents/"+p),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},ghH()),body:JSON.stringify({message:"Dossier "+c.id+" ("+(c.by||"?")+")",content:b64(JSON.stringify(c))})});
if(r.status===200||r.status===201||r.status===422){ghErr=0;Q=Q.filter(function(x){return!(x.key===c.key&&x.t===c.t)});persistQ();status()}
else{ghErr=r.status;break}}}catch(e){}
busy=false;status()}
async function pull(manual){if(pulling||!ghOk())return;pulling=true;
try{var r=await fetch(ghApi("/git/trees/main?recursive=1"),{headers:ghH()});
if(r.status===404||r.status===409){ghErr=r.status===404?404:0;pulling=false;status();return}
if(!r.ok){ghErr=r.status;pulling=false;status();return}
ghErr=0;var j=await r.json(),last={};
j.tree.forEach(function(t){var m=/^cases\/([^\/]+)\/([^\/]+\.json)$/.exec(t.path);if(m&&t.type==="blob"&&(!last[m[1]]||m[2]>last[m[1]].name))last[m[1]]={name:m[2],sha:t.sha}});
var todo=Object.keys(last).filter(function(k){return GC.seen[k]!==last[k].sha}),changed=false;
for(var i=0;i<todo.length;i+=5){await Promise.all(todo.slice(i,i+5).map(async function(k){
try{var br=await fetch(ghApi("/git/blobs/"+last[k].sha),{headers:ghH()});if(!br.ok)return;var bj=await br.json(),c=JSON.parse(unb64(bj.content));
if(c&&c.key){if(!GC.cases[c.key]||(c.t||"")>(GC.cases[c.key].t||""))GC.cases[c.key]=c;GC.seen[k]=last[k].sha;changed=true}}catch(e){}}))}
if(changed){persistGC();applyRemote();var a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()}
if(manual)toast(changed?"Nouveaux dossiers reçus.":"Déjà à jour.")}catch(e){}
pulling=false;status()}
function activateCode(c){var o=fromCode(c);if(!o){toast("Code d'activation invalide.");return false}
GH={repo:o.repo,token:o.token};ghErr=0;if(o.role&&PROFILES[o.role]){PROF={role:o.role,site:o.site||"",sect:o.sect||0,zone:o.zone||0};try{localStorage.setItem("lag-prof",JSON.stringify(PROF))}catch(e){}tab=PROFILES[PROF.role].tabs[0]||"list"}try{localStorage.setItem("lag-gh",JSON.stringify(GH))}catch(e){}status();render();syncAll();toast("Synchronisation activée.");return true}
function cfgSync(){gotoTab("sync")}
function activate(){activateCode(v("act"))}
function syncAll(){return flush().then(function(){return pull()})}
window.addEventListener("online",syncAll);setInterval(syncAll,60000);
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});
status();render();restore();syncAll();setInterval(function(){load()},30000);
